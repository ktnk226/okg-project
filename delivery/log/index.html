<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>::: デリログ :::</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08090d; --surface: #0f1117; --surface2: #161820;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --text: #f0f0f0; --muted: rgba(255,255,255,0.45); --muted2: rgba(255,255,255,0.7);
      --accent: #ff5c1a; --accent2: #e91e8c; --green: #00e676; --yellow: #ffd600;
      --blue: #2979ff; --teal: #00bcd4;
      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'Noto Sans JP', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --radius: 14px; --radius-sm: 9px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; font-size: 16px; }
    
    /* APP LAYOUT */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 110px; }
    
    /* SIDEBAR (PC用) */
    .sidebar {
      width: 260px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 20px; gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand-mark { font-size: 28px; }
    .brand-title { font-family: var(--font-head); font-size: 26px; letter-spacing: 0.05em; color: #fff; line-height: 1.1; }
    
    .nav-menu { display: flex; flex-direction: column; gap: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      background: transparent; border: none; border-radius: var(--radius-sm);
      color: var(--muted2); font-size: 16px; font-weight: 700; text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .nav-item.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 900; }

    /* HEADER TOPBAR */
    .topbar {
      background: rgba(8,9,13,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .topbar h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
    .topbar p { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* PERIOD SWITCHER TABS */
    .period-switcher-container { padding: 16px 20px 0; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
    .period-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); padding: 5px; border-radius: var(--radius-sm); width: 100%; max-width: 440px; margin: 0 auto; }
    .period-tab { flex: 1; background: transparent; border: none; color: var(--muted2); padding: 11px 0; font-size: 17px; font-weight: 800; cursor: pointer; border-radius: 6px; transition: all 0.2s; text-align: center; }
    .period-tab.active { background: var(--surface2); color: var(--accent); border: 1px solid rgba(255,92,26,0.3); font-weight: 900; }

    /* ◀ PERIOD NAV BAR ▶ */
    .period-nav-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin: 0 auto; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 16px; }
    .period-nav-btn { background: transparent; border: none; color: var(--accent); font-size: 20px; font-weight: 900; cursor: pointer; padding: 4px 14px; user-select: none; }
    .period-nav-btn:hover { color: #fff; }
    .period-nav-display { font-size: 16px; font-weight: 800; font-family: var(--font-mono); color: #fff; text-align: center; }

    /* SUMMARY BAR */
    .summary-bar {
      background: var(--surface); border-bottom: 1.5px solid var(--border);
      padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .sum-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sum-row.col-3 { grid-template-columns: 1fr 1fr 1fr; }
    .sum-item { padding: 0; min-width: 0; }
    .sum-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; font-weight: 700; }
    .sum-val { font-size: 21px; font-family: var(--font-mono); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum-val.accent { color: var(--accent); font-size: 23px; }
    .sum-val.green { color: var(--green); }
    .sum-val.yellow { color: var(--yellow); }
    .sum-val.teal { color: var(--teal); }
    .sum-row + .sum-row { border-top: 1px solid var(--border); padding-top: 10px; }

    /* SPLIT WEEK SUMMARY */
    .week-split-container {
      background: var(--surface2);
      border-bottom: 1.5px solid var(--border);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .split-card {
      background: rgba(255,255,255,0.03);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .split-title { font-size: 14px; font-weight: 800; letter-spacing: 0.03em; }
    .split-title.weekday { color: var(--teal); }
    .split-title.weekend { color: var(--accent); }
    .split-main-amt { font-size: 22px; font-weight: 800; font-family: var(--font-mono); color: #fff; }
    .split-sub-row { font-size: 13px; font-family: var(--font-mono); color: var(--muted2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .split-sub-metrics { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; font-family: var(--font-mono); color: var(--muted2); margin-top: 4px; }
    .split-sub-metrics span, .split-sub-row span { white-space: nowrap; }

    /* GOAL PANEL */
    .goal-panel { background: var(--surface); border-bottom: 1.5px solid var(--border); padding: 18px 22px; }
    .goal-inputs-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
    .goal-input-row { display: flex; justify-content: space-between; align-items: center; }
    .goal-title-flex { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted2); font-weight: 800; }
    .goal-input-wrapper { display: flex; align-items: center; gap: 6px; }
    .goal-input { font-family: var(--font-mono); font-size: 18px; font-weight: 800; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; width: 130px; text-align: right; }
    
    .progress-section { margin-top: 10px; }
    .progress-track { width: 100%; height: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; overflow: hidden; margin-bottom: 6px; border: 1px solid var(--border); }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s ease; }
    .progress-bar.green { background: linear-gradient(90deg, var(--teal), var(--green)); }
    
    .goal-footer-row { display: flex; justify-content: space-between; font-size: 14px; font-family: var(--font-mono); flex-direction: column; gap: 4px; }
    .goal-footer-top { display: flex; justify-content: space-between; width: 100%; align-items: center; }
    .goal-footer-sub { display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: 12px; font-family: var(--font-mono); margin-top: 2px; }
    .goal-status-text { color: var(--muted); }
    .goal-status-text strong { color: #fff; }
    .goal-remain-text { font-weight: 800; }
    .goal-remain-text.done { color: var(--green); }
    .goal-remain-text.remain { color: var(--accent); }

    /* VIEW MANAGEMENT */
    .view-container { padding: 22px; max-width: 760px; width: 100%; margin: 0 auto; display: none; }
    .view-container.active { display: block; }
    .section-title { font-size: 15px; font-weight: 800; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; margin-top: 20px; }

    /* CARDS & FORMS */
    .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 14px; color: var(--muted2); display: block; margin-bottom: 6px; font-weight: 700; }
    input, select, textarea {
      width: 100%; padding: 13px 15px; background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border2); border-radius: var(--radius-sm); color: #fff; font-size: 16px; font-family: var(--font-body);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.08); }

    .condition-row { display: flex; gap: 8px; margin-top: 4px; }
    .cond-btn {
      flex: 1; padding: 12px 6px; background: rgba(255,255,255,0.04); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--muted2); font-size: 17px; font-weight: 800; cursor: pointer; text-align: center;
    }
    .cond-btn.active { border-color: var(--yellow); background: rgba(255,214,0,0.12); color: #fff; font-weight: 900; }

    .daily-memo-textarea {
      width: 100%; min-height: 120px; background: rgba(0,0,0,0.3); border: 1.5px solid var(--border2);
      border-radius: var(--radius-sm); color: #fff; font-size: 16px; line-height: 1.6; padding: 14px;
      font-family: var(--font-body); resize: vertical;
    }

    /* SET CARD */
    .set-card { background: rgba(255,255,255,0.02); border: 1.5px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
    .set-header { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; user-select: none; }
    .set-header:hover { background: rgba(255,255,255,0.03); }
    .set-header-top { display: flex; align-items: center; justify-content: space-between; }
    .set-title { font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .set-badge { font-size: 12px; padding: 4px 9px; border-radius: 4px; font-weight: 800; }
    .set-badge.active { background: rgba(255,92,26,0.2); color: var(--accent); }
    .set-badge.done { background: rgba(0,230,118,0.15); color: var(--green); }
    
    .set-summary-row1 { font-size: 20px; font-weight: 800; color: #fff; font-family: var(--font-mono); }
    .set-summary-row2 { font-size: 14px; color: var(--muted2); font-family: var(--font-mono); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .set-summary-tag { background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }

    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; margin-bottom: 12px; }
    .time-field { display: flex; gap: 6px; }
    .stamp-btn { padding: 0 16px; background: var(--accent); color: #fff; border-radius: 6px; font-size: 14px; font-weight: 900; border: none; cursor: pointer; min-height: 48px; }
    .stamp-btn.secondary { background: rgba(255,255,255,0.15); }
    .time-duration { font-size: 14px; color: var(--teal); font-family: var(--font-mono); margin-top: 4px; font-weight: 800; }

    .platform-block { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; }
    .platform-title { font-weight: 800; font-size: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .diff-badge { font-size: 14px; font-family: var(--font-mono); opacity: 0.9; }
    .pf-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .del-btn { width: 100%; padding: 14px; background: rgba(255,50,50,0.15); color: #ff5555; border: 1px solid rgba(255,50,50,0.3); border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 12px; font-size: 15px; }
    .add-btn { width: 100%; padding: 18px; background: rgba(255,255,255,0.05); color: #fff; border: 1.5px dashed var(--border2); border-radius: var(--radius); font-weight: 800; cursor: pointer; font-size: 17px; }

    .log-box { background: #000; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 14px; padding: 18px; font-family: var(--font-mono); font-size: 14px; white-space: pre-wrap; line-height: 1.7; color: #ccc; }
    .copy-btn { width: 100%; margin-top: 10px; padding: 16px; background: var(--green); color: #000; font-weight: 900; border-radius: 8px; border: none; cursor: pointer; font-size: 17px; }

    /* CALENDAR */
    .cal-header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cal-title-nav { display: flex; align-items: center; gap: 14px; }
    .cal-nav-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 16px; }
    .cal-nav-btn:hover { background: rgba(255,255,255,0.15); }
    .cal-title-text { font-size: 22px; font-weight: 900; }
    .cal-monthly-total { font-family: var(--font-mono); font-size: 19px; font-weight: 800; color: var(--accent); background: rgba(255,92,26,0.1); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,92,26,0.25); }

    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 12px; width: 100%; }
    .cal-head-cell { text-align: center; font-size: 14px; color: var(--muted); font-weight: 800; padding: 6px 0; }
    
    .cal-day-cell {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px;
      min-height: 96px; padding: 6px 4px; cursor: pointer; display: flex; flex-direction: column;
      justify-content: space-between; min-width: 0; position: relative; overflow: hidden;
    }
    .cal-day-cell:hover { background: var(--surface2); border-color: var(--muted2); }
    .cal-day-cell.empty { background: transparent; border: none; cursor: default; }
    .cal-day-cell.selected { border-color: var(--accent); background: rgba(255,92,26,0.08); }
    
    .cal-day-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .cal-day-num { font-size: 15px; font-weight: 800; font-family: var(--font-mono); color: var(--muted2); }
    .cal-day-num.current-month { color: #fff; }
    .cal-day-cond { font-size: 12px; line-height: 1; }
    
    .cal-day-amt-box { text-align: right; width: 100%; margin-top: auto; }
    .cal-day-amt {
      font-size: 13px; font-family: var(--font-mono); font-weight: 800; color: var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }

    /* 📝 MEMO / INBOX (Keep風ポップアップ編集 & 視認性UP) */
    .memo-cat-filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .memo-cat-btn {
      padding: 9px 16px; background: rgba(255,255,255,0.05); border: 1.5px solid var(--border);
      border-radius: 22px; color: var(--muted2); font-size: 15px; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .memo-cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 900; }
    
    .memo-item-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 18px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px;
      cursor: pointer; transition: all 0.2s;
    }
    .memo-item-card:hover { background: var(--surface2); border-color: var(--muted2); }
    .memo-item-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
    
    .memo-preview-text {
      font-size: 17px; line-height: 1.6; color: #fff; white-space: pre-wrap;
      word-break: break-word; max-height: 160px; overflow: hidden; position: relative;
    }
    .memo-tag-pill {
      font-size: 13px; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.08);
      color: var(--teal); font-weight: 800; border: 1px solid var(--border);
    }

    /* 🪟 Google Keep風 全面ポップアップ編集モーダル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px);
      z-index: 9999; display: flex; justify-content: center; align-items: center;
      padding: 16px; animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .memo-modal-card {
      background: var(--surface); border: 1.5px solid var(--border2); border-radius: 18px;
      width: 100%; max-width: 680px; height: 86vh; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1.5px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .modal-body {
      flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto;
    }
    .modal-textarea {
      flex: 1; width: 100%; height: 100%; background: transparent; border: none;
      color: #fff; font-size: 18px; line-height: 1.7; font-family: var(--font-body);
      resize: none; outline: none; padding: 0;
    }
    .modal-footer {
      padding: 14px 20px; border-top: 1.5px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25);
    }

    /* BOTTOM NAV TABS */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 76px; background: rgba(15,17,23,0.95); backdrop-filter: blur(20px); border-top: 1.5px solid var(--border); display: none; justify-content: space-around; align-items: center; z-index: 500; }
    .tab-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--muted); gap: 4px; font-size: 13px; font-weight: 700; cursor: pointer; width: 75px; }
    .tab-btn.active { color: var(--accent); font-weight: 900; }
    .nav-icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: color 0.2s; }
    .tab-btn.active .nav-icon { stroke: var(--accent); }

    .cloud-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; padding: 6px 14px; border-radius: 20px; background: rgba(41,121,255,0.1); color: var(--blue); }
    .cloud-indicator.unsaved { background: rgba(255,214,0,0.1); color: var(--yellow); }
    .gen-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: var(--radius); color: #fff; font-size: 19px; font-weight: 900; border: none; cursor: pointer; }

    /* 📱 スマホ最適化 */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .bottom-nav { display: flex; }
      .topbar { padding: 14px 16px; }
      .view-container { padding: 16px; }
      .summary-bar { padding: 14px 16px; gap: 10px; }
      .week-split-container { padding: 12px 16px; gap: 10px; }
      .goal-panel { padding: 14px 16px; }
      .grid-3 { grid-template-columns: 1fr; gap: 12px; }
      
      .cal-day-cell { min-height: 82px; padding: 4px 2px; }
      .cal-day-num { font-size: 13px; }
      .cal-day-amt { font-size: 12px; font-weight: 800; } 
      
      .sum-val { font-size: 19px; }
      .sum-val.accent { font-size: 22px; }
      .split-main-amt { font-size: 19px; }

      .memo-modal-card { height: 92vh; border-radius: 14px; }
      .modal-textarea { font-size: 17px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

const SK = {
  db: 'delivery_log_vault_v13',
  currentDate: 'delivery_log_current_date_v13',
  goals: 'delivery_log_periodic_goals_v13',
  memos: 'delivery_log_inbox_memos_v13'
};

const PLATFORMS = [
  { key: 'd', label: '出前館', color: '#ff2a2a' },
  { key: 'u', label: 'Uber Eats',   color: '#06C167' },
  { key: 'r', label: 'RocketNow', color: '#2979ff' },
  { key: 'm', label: 'menu',   color: '#e91e8c' },
];

const WEATHERS = ['晴','曇','雨','雪','晴→雨','雨→晴','曇→雨'];
const COND_ICONS = [
  { val: 1, label: '😫 1' },
  { val: 2, label: '😕 2' },
  { val: 3, label: '😐 3' },
  { val: 4, label: '🙂 4' },
  { val: 5, label: '🔥 5' },
];

const MEMO_CATEGORIES = ['🛵稼働', '💡アイデア', '📌タスク', '📓日記'];

function getNow() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getBusinessDateStr() {
  const d = new Date();
  if (d.getHours() < 4) { d.setDate(d.getDate() - 1); }
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateToParam(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatSmartAmt(amt) {
  if (!amt || amt === 0) return '';
  if (amt >= 10000) {
    const man = (amt / 10000).toFixed(1);
    return `${man.endsWith('.0') ? Math.floor(amt/10000) : man}万`;
  }
  return `¥${amt.toLocaleString()}`;
}

function calcDuration(start, end) {
  if (!start || !end) return null;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diffMin = (eh * 60 + em) - (sh * 60 + sm);
  if (diffMin < 0) diffMin += 24 * 60;
  return { total: diffMin / 60, h: Math.floor(diffMin / 60), m: diffMin % 60 };
}

function loadInitialVault() {
  const saved = localStorage.getItem(SK.db);
  return saved ? JSON.parse(saved) : {};
}

function loadInitialDate() {
  const saved = localStorage.getItem(SK.currentDate);
  return saved || getBusinessDateStr();
}

function loadInitialGoals() {
  const saved = localStorage.getItem(SK.goals);
  return saved ? JSON.parse(saved) : {}; 
}

function loadInitialMemos() {
  const saved = localStorage.getItem(SK.memos);
  return saved ? JSON.parse(saved) : [];
}

function getYearWeekStr(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  const mondayOffset = day === 0 ? -6 : 1 - day;
  const mon = new Date(d.getTime() + mondayOffset * 86400000);
  const year = mon.getFullYear();
  const startOfYear = new Date(year, 0, 1);
  const weekNum = Math.ceil((((mon - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
  return `${year}-W${String(weekNum).padStart(2,'0')}`;
}

      }

  }, [date]);

  const updateSet = useCallback((i, key, val) => {

  }, [sets, updateDayField]);

  const toggleOpen = (i) => {
    const newSets = [...sets]; newSets[i] = { ...newSets[i], open: !newSets[i].open };
    updateDayField('sets', newSets);
  };

  const goalStorageKey = useMemo(() => {
    const [y, m] = date.split('-');

    if (period === 'week') return `W-${getYearWeekStr(date)}`;
    if (period === 'month') return `M-${y}-${m}`;

  }, [date, period]);

  const updatePeriodicGoal = (field, val) => {
    setPeriodicGoals(prev => {
      const currentGoal = prev[goalStorageKey] || {};
      const updated = typeof currentGoal === 'object' && currentGoal !== null 
        ? { ...currentGoal, [field]: Number(val) }
        : { amt: Number(currentGoal || 0), cnt: 0, [field]: Number(val) };
      return { ...prev, [goalStorageKey]: updated };
    });
  };

  const calced = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    return sets.map((s, i) => {
      const p = sets[i-1] || { d_cum:0, u_cum:0, r_cum:0, m_cum:0, d_cnt_cum:0, u_cnt_cum:0, r_cnt_cum:0, m_cnt_cum:0, d_que_cum:0, u_que_cum:0, r_que_cum:0, m_que_cum:0, km_cum:0 };
      const sp = (n(s.d_cum)-n(p.d_cum)) + (n(s.u_cum)-n(p.u_cum)) + (n(s.r_cum)-n(p.r_cum)) + (n(s.m_cum)-n(p.m_cum)) + (n(s.d_que_cum)-n(p.d_que_cum)) + (n(s.u_que_cum)-n(p.u_que_cum)) + (n(s.r_que_cum)-n(p.r_que_cum)) + (n(s.m_que_cum)-n(p.m_que_cum));
      const sc = (n(s.d_cnt_cum)-n(p.d_cnt_cum)) + (n(s.u_cnt_cum)-n(p.u_cnt_cum)) + (n(s.r_cnt_cum)-n(p.r_cnt_cum)) + (n(s.m_cnt_cum)-n(p.m_cnt_cum));
      const dur = calcDuration(s.start, s.end);
      const setJikyu = (dur && dur.total > 0) ? Math.round(sp / dur.total) : 0;
      const setTanka = sc > 0 ? Math.round(sp / sc) : 0;

      return {
        ...s,
        d_p: n(s.d_cum)-n(p.d_cum), u_p: n(s.u_cum)-n(p.u_cum), r_p: n(s.r_cum)-n(p.r_cum), m_p: n(s.m_cum)-n(p.m_cum),
        d_c: n(s.d_cnt_cum)-n(p.d_cnt_cum), u_c: n(s.u_cnt_cum)-n(p.u_cnt_cum), r_c: n(s.r_cnt_cum)-n(p.r_cnt_cum), m_c: n(s.m_cnt_cum)-n(p.m_cnt_cum),
        d_qp: n(s.d_que_cum)-n(p.d_que_cum), u_qp: n(s.u_que_cum)-n(p.u_que_cum), r_qp: n(s.r_que_cum)-n(p.r_que_cum), m_qp: n(s.m_que_cum)-n(p.m_que_cum),
        km_p: n(s.km_cum)-n(p.km_cum), dur, setJikyu, setTanka, sp, sc
      };
    });
  }, [sets]);

  const daySummary = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    const last = sets[sets.length - 1] || EMPTY_SET();
    const total_sales = n(last.d_cum) + n(last.u_cum) + n(last.r_cum) + n(last.m_cum);
    const total_que   = n(last.d_que_cum) + n(last.u_que_cum) + n(last.r_que_cum) + n(last.m_que_cum);
    const total_cnt   = n(last.d_cnt_cum) + n(last.u_cnt_cum) + n(last.r_cnt_cum) + n(last.m_cnt_cum);
    const total_km    = n(last.km_cum);

    return { total_sales: total_sales + total_que, real_sales: total_sales, total_que, total_cnt, total_km, total_h, jikyu: total_h > 0 ? Math.round((total_sales + total_que) / total_h) : 0 };
  }, [sets, calced]);

  const periodMeta = useMemo(() => {
    const current = new Date(date);
    const day = current.getDay();
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const mon = new Date(current.getTime() + mondayOffset * 86400000);
    const sun = new Date(mon.getTime() + 6 * 86400000);
    const [y, m, d] = date.split('-');

      dayStr: `${y}/${m}/${d} (${dayJa})`,

      monthStr: `${y}年 ${m}月 累計`,
      yearStr: `${y}年 年間累計`,
      monRef: mon, sunRef: sun,
      dayOfWeek: day
    };
  }, [date]);

  const periodicAnalysis = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    const [targetYear, targetMonth] = date.split('-').map(Number);
    
    let monthTotal = 0; let monthReal = 0; let monthQue = 0; let monthCnt = 0; let monthHours = 0; let monthKm = 0;
    let weekTotal = 0; let weekReal = 0; let weekQue = 0; let weekCnt = 0; let weekHours = 0; let weekKm = 0;
    let yearTotal = 0; let yearReal = 0; let yearQue = 0; let yearCnt = 0; let yearHours = 0; let yearKm = 0;

    let weekMonThu = { total: 0, real: 0, que: 0, cnt: 0, hours: 0, km: 0 };
    let weekFriSun = { total: 0, real: 0, que: 0, cnt: 0, hours: 0, km: 0 };

    const createPfBuffer = () => ({ d: { s:0, c:0 }, u: { s:0, c:0 }, r: { s:0, c:0 }, m: { s:0, c:0 } });
    const weekPf = createPfBuffer();
    const monthPf = createPfBuffer();
    const yearPf = createPfBuffer();

    Object.keys(vault).forEach(dKey => {
      const [y, m] = dKey.split('-').map(Number);
      const dayVault = vault[dKey]; const sList = dayVault.sets || []; if (sList.length === 0) return;

      const lastS = sList[sList.length - 1];
      const sales = n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum);
      const que = n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum);
      const cnt = n(lastS.d_cnt_cum) + n(lastS.u_cnt_cum) + n(lastS.r_cnt_cum) + n(lastS.m_cnt_cum);
      const km = n(lastS.km_cum);
      const totalAmt = sales + que;

      const dayCalced = sList.map(s => ({ dur: calcDuration(s.start, s.end) }));
      const dayTotalHours = dayCalced.reduce((a, s) => a + (s.dur ? s.dur.total : 0), 0);

      const getPfData = (k) => ({
        sales: n(lastS[k+'_cum']) + n(lastS[k+'_que_cum']),
        cnt: n(lastS[k+'_cnt_cum'])
      });

      if (y === targetYear) {
        yearTotal += totalAmt; yearReal += sales; yearQue += que; yearCnt += cnt; yearHours += dayTotalHours; yearKm += km;
        PLATFORMS.forEach(p => {
          const pData = getPfData(p.key);
          yearPf[p.key].s += pData.sales; yearPf[p.key].c += pData.cnt;
        });

        if (m === targetMonth) {
          monthTotal += totalAmt; monthReal += sales; monthQue += que; monthCnt += cnt; monthHours += dayTotalHours; monthKm += km;
          PLATFORMS.forEach(p => {
            const pData = getPfData(p.key);
            monthPf[p.key].s += pData.sales; monthPf[p.key].c += pData.cnt;
          });
        }
      }

      const thisDate = new Date(dKey + 'T00:00:00');
      const monMidnight = new Date(periodMeta.monRef); monMidnight.setHours(0,0,0,0);
      const sunMidnight = new Date(periodMeta.sunRef); sunMidnight.setHours(23,59,59,999);

      if (thisDate >= monMidnight && thisDate <= sunMidnight) {
        weekTotal += totalAmt; weekReal += sales; weekQue += que; weekCnt += cnt; weekHours += dayTotalHours; weekKm += km;
        PLATFORMS.forEach(p => {
          const pData = getPfData(p.key);
          weekPf[p.key].s += pData.sales; weekPf[p.key].c += pData.cnt;
        });

        const dayOfWeek = thisDate.getDay();
        if (dayOfWeek >= 1 && dayOfWeek <= 4) {
          weekMonThu.total += totalAmt; weekMonThu.real += sales; weekMonThu.que += que; weekMonThu.cnt += cnt; weekMonThu.hours += dayTotalHours; weekMonThu.km += km;
        } else {
          weekFriSun.total += totalAmt; weekFriSun.real += sales; weekFriSun.que += que; weekFriSun.cnt += cnt; weekFriSun.hours += dayTotalHours; weekFriSun.km += km;
        }
      }
    });

    const lastDayS = sets[sets.length - 1] || EMPTY_SET();
    const dayPf = createPfBuffer();
    PLATFORMS.forEach(p => {
      dayPf[p.key].s = n(lastDayS[p.key+'_cum']) + n(lastDayS[p.key+'_que_cum']);
      dayPf[p.key].c = n(lastDayS[p.key+'_cnt_cum']);
    });

    return { 
      day: { total: daySummary.total_sales, real: daySummary.real_sales, que: daySummary.total_que, cnt: daySummary.total_cnt, hours: daySummary.total_h, km: daySummary.total_km, pf: dayPf },
      week: { 
        total: weekTotal, real: weekReal, que: weekQue, cnt: weekCnt, hours: weekHours, km: weekKm, pf: weekPf,
        monThu: {
          ...weekMonThu,
          jikyu: weekMonThu.hours > 0 ? Math.round(weekMonThu.total / weekMonThu.hours) : 0,
          tanka: weekMonThu.cnt > 0 ? Math.round(weekMonThu.total / weekMonThu.cnt) : 0,
          realTanka: weekMonThu.cnt > 0 ? Math.round(weekMonThu.real / weekMonThu.cnt) : 0,
          uph: weekMonThu.hours > 0 ? (weekMonThu.cnt / weekMonThu.hours).toFixed(1) : '0.0'
        },
        friSun: {
          ...weekFriSun,
          jikyu: weekFriSun.hours > 0 ? Math.round(weekFriSun.total / weekFriSun.hours) : 0,
          tanka: weekFriSun.cnt > 0 ? Math.round(weekFriSun.total / weekFriSun.cnt) : 0,
          realTanka: weekFriSun.cnt > 0 ? Math.round(weekFriSun.real / weekFriSun.cnt) : 0,
          uph: weekFriSun.hours > 0 ? (weekFriSun.cnt / weekFriSun.hours).toFixed(1) : '0.0'
        }
      },
      month: { total: monthTotal, real: monthReal, que: monthQue, cnt: monthCnt, hours: monthHours, km: monthKm, pf: monthPf },
      year: { total: yearTotal, real: yearReal, que: yearQue, cnt: yearCnt, hours: yearHours, km: yearKm, pf: yearPf }
    };
  }, [vault, date, daySummary, periodMeta, sets]);

  /* 🎯 目標・進捗 & PF別必要件数換算 & キロ単価ロジック */
  const activePeriodData = useMemo(() => {
    const data = periodicAnalysis[period];
    const rawGoal = periodicGoals[goalStorageKey];
    const goalAmt = typeof rawGoal === 'object' && rawGoal !== null ? (rawGoal.amt || 0) : Number(rawGoal || 0);
    const goalCnt = typeof rawGoal === 'object' && rawGoal !== null ? (rawGoal.cnt || 0) : 0;
    const remainAmt = goalAmt > 0 ? goalAmt - data.total : 0;
    const percentAmt = goalAmt > 0 ? Math.min(Math.round((data.total / goalAmt) * 100), 100) : 0;
    const remainCnt = goalCnt > 0 ? goalCnt - data.cnt : 0;
    const percentCnt = goalCnt > 0 ? Math.min(Math.round((data.cnt / goalCnt) * 100), 100) : 0;
    const tanka = data.cnt > 0 ? Math.round(data.total / data.cnt) : 0;
    const realTanka = data.cnt > 0 ? Math.round(data.real / data.cnt) : 0;
    const needCnt = (remainAmt > 0 && tanka > 0) ? Math.ceil(remainAmt / tanka) : 0;

    // キロ単価換算（総売上 ÷ 走行距離）
    const kmTanka = data.km > 0 ? Math.round(data.total / data.km) : 0;

    // パターンB: 稼働前は基準単価、実績が出たらリアル単価に自動連動
    const isWeekend = (periodMeta.dayOfWeek === 0 || periodMeta.dayOfWeek === 6);
    const defaultDemaeTanka = isWeekend ? 550 : 500;
    const defaultUberTanka = 350;

    const dPf = data.pf?.d || { s: 0, c: 0 };
    const uPf = data.pf?.u || { s: 0, c: 0 };

    const effectiveDTanka = dPf.c > 0 ? Math.round(dPf.s / dPf.c) : defaultDemaeTanka;
    const effectiveUTanka = uPf.c > 0 ? Math.round(uPf.s / uPf.c) : defaultUberTanka;

    const needCntD = (remainAmt > 0 && effectiveDTanka > 0) ? Math.ceil(remainAmt / effectiveDTanka) : 0;
    const needCntU = (remainAmt > 0 && effectiveUTanka > 0) ? Math.ceil(remainAmt / effectiveUTanka) : 0;

    let dailyNorma = 0;
    if (remainAmt > 0) {
      const currentRef = new Date(date);
      if (period === 'day') dailyNorma = remainAmt;
      else if (period === 'week') {
        const dayIdx = currentRef.getDay();
        const remainDays = dayIdx === 0 ? 1 : 7 - dayIdx + 1;
        dailyNorma = Math.ceil(remainAmt / remainDays);
      } else if (period === 'month') {
        const lastDay = new Date(currentRef.getFullYear(), currentRef.getMonth() + 1, 0).getDate();
        dailyNorma = Math.ceil(remainAmt / (lastDay - currentRef.getDate() + 1));
      } else if (period === 'year') {
        const lastDay = new Date(currentRef.getFullYear(), 11, 31);
        const remainDays = Math.ceil((lastDay - currentRef) / (1000 * 60 * 60 * 24)) + 1;
        dailyNorma = Math.ceil(remainAmt / remainDays);
      }
    }
    const periodJikyu = data.hours > 0 ? Math.round(data.total / data.hours) : 0;
    const uph = data.hours > 0 ? (data.cnt / data.hours).toFixed(1) : '0.0';

    return { 
      ...data, goalAmt, goalCnt, remainAmt, percentAmt, remainCnt, percentCnt, needCnt, 
      needCntD, needCntU, effectiveDTanka, effectiveUTanka, isRealD: dPf.c > 0, isRealU: uPf.c > 0,
      dailyNorma, periodJikyu, kmTanka, tanka, realTanka, uph 
    };
  }, [periodicAnalysis, period, periodicGoals, goalStorageKey, date, periodMeta]);

  const handleStepPeriod = (direction) => {
    const current = new Date(date);
    if (period === 'day') current.setDate(current.getDate() + direction);
    else if (period === 'week') current.setDate(current.getDate() + (direction * 7));
    else if (period === 'month') current.setMonth(current.getMonth() + direction);
    else if (period === 'year') current.setFullYear(current.getFullYear() + direction);
    setDate(formatDateToParam(current));
  };

  const handleCalendarMonthChange = (direction) => {
    let nextMonth = calMonth + direction; let nextYear = calYear;
    if (nextMonth < 1) { nextMonth = 12; nextYear -= 1; }
    else if (nextMonth > 12) { nextMonth = 1; nextYear += 1; }
    setCalYear(nextYear); setCalMonth(nextMonth);
  };

  const startNewDay = () => {
    const targetDate = getBusinessDateStr();
    if (date === targetDate) {
      if (!window.confirm('現在の最新営業日データを完全にクリアしてリセットしますか？')) return;

      setVault(prev => ({ ...prev, [targetDate]: { weather: '晴', condition: 4, sleepHours: 7, goalAmt: 0, dailyMemo: '', sets: [EMPTY_SET()] } }));
    } else { setDate(targetDate); }
    setActiveTab('dashboard'); setPeriod('day');
  };

  const deleteSet = (i) => {
    if (sets.length <= 1) return;
    if (!window.confirm(`SET ${i+1} を削除しますか？`)) return;
    setIsDirty(true);
    updateDayField('sets', sets.filter((_, idx) => idx !== i));
  };

  const currentCalendarMonthTotal = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    let total = 0;
    Object.keys(vault).forEach(dKey => {
      const [y, m] = dKey.split('-').map(Number);
      if (y === calYear && m === calMonth) {
        const dayVault = vault[dKey]; const sList = dayVault.sets || [];
        if (sList.length > 0) {
          const lastS = sList[sList.length - 1];
          total += (n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum)) + (n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum));
        }
      }
    });
    return total;
  }, [vault, calYear, calMonth]);

  const addPeriodicSet = () => {
    setIsDirty(true);
    const last = sets[sets.length - 1] || EMPTY_SET();
    updateDayField('sets', [...sets, {
      ...EMPTY_SET(),
      d_cum: last.d_cum, u_cum: last.u_cum, r_cum: last.r_cum, m_cum: last.m_cum,
      d_cnt_cum: last.d_cnt_cum, u_cnt_cum: last.u_cnt_cum, r_cnt_cum: last.r_cnt_cum, m_cnt_cum: last.m_cnt_cum,
      d_que_cum: last.d_que_cum, u_que_cum: last.u_que_cum, r_que_cum: last.r_que_cum, m_que_cum: last.m_que_cum,
      km_cum: last.km_cum,
    }]);
  };

  const calendarDays = useMemo(() => {
    const firstDayIndex = new Date(calYear, calMonth - 1, 1).getDay();
    const totalDays = new Date(calYear, calMonth, 0).getDate();
    const mondayBasedStartIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

    const cells = [];
    for (let i = 0; i < mondayBasedStartIndex; i++) { cells.push({ empty: true }); }
    for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
      const currentKey = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      const dayVault = vault[currentKey]; let totalSales = 0; let dayCond = null;
      if (dayVault) {
        dayCond = dayVault.condition;
        if (dayVault.sets && dayVault.sets.length > 0) {
          const n = v => parseFloat(v) || 0; const lastS = dayVault.sets[dayVault.sets.length - 1];
          totalSales = (n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum)) + (n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum));
        }
      }
      cells.push({ empty: false, dayNum, dateKey: currentKey, amt: totalSales, cond: dayCond });
    }
    return cells;
  }, [vault, calYear, calMonth]);

  const saveToiCloudJSON = () => {
    const backup = { vault, periodicGoals, memos, version: 13 };
    const dataStr = JSON.stringify(backup, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob); const link = document.createElement("a");
    link.setAttribute("href", url); link.setAttribute("download", "delilog_master_backup.json");
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setIsDirty(false);
  };

  const loadFromiCloudJSON = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        if (data.vault) {
          setVault(data.vault);
          if (data.periodicGoals) setPeriodicGoals(data.periodicGoals);
          if (data.memos) setMemos(data.memos);
        } else {
          setVault(data);
        }
        setIsDirty(false); alert("iCloudバックアップから同期しました！");
      } catch (err) { alert("同期に失敗しました。形式をご確認ください。"); }
    };
    reader.readAsText(file); e.target.value = '';
  };

  const addInboxMemo = () => {
    if (!newMemoText.trim()) return;
    const newEntry = {
      id: Date.now(),
      date: getBusinessDateStr(),
      time: getNow(),
      cat: newMemoCat,
      text: newMemoText.trim()
    };
    setMemos(prev => [newEntry, ...prev]);
    setNewMemoText('');
    setIsDirty(true);
  };

  const updateInboxMemoText = (id, newText) => {
    setIsDirty(true);
    setMemos(prev => prev.map(m => m.id === id ? { ...m, text: newText } : m));
  };

  const setInboxMemoCat = (id, newCat) => {
    setIsDirty(true);
    setMemos(prev => prev.map(m => m.id === id ? { ...m, cat: newCat } : m));
  };

  const deleteInboxMemo = (id) => {
    if (!window.confirm('このメモを削除しますか？')) return;
    setMemos(prev => prev.filter(m => m.id !== id));
    if (editingMemoId === id) setEditingMemoId(null);
    setIsDirty(true);
  };

  const filteredMemos = useMemo(() => {
    return memos.filter(m => {
      const matchCat = memoFilter === 'すべて' || m.cat === memoFilter;
      const matchText = !memoSearch.trim() || m.text.toLowerCase().includes(memoSearch.toLowerCase());
      return matchCat && matchText;
    });
  }, [memos, memoFilter, memoSearch]);

  const activeEditingMemo = useMemo(() => {
    return memos.find(m => m.id === editingMemoId) || null;

  const generateLog = () => {
    const n = v => parseFloat(v) || 0;
    const { real_sales, total_que, total_cnt, total_km, total_h, jikyu } = daySummary;
    const dayJa = ['日','月','火','水','木','金','土'][new Date(date).getDay()];
    const dateStr = date.replace(/-/g,'/');

    const last = sets[sets.length - 1] || EMPTY_SET();
    const d_total = n(last.d_cum); const u_total = n(last.u_cum); const r_total = n(last.r_cum); const m_total = n(last.m_cum);
    const d_cnt   = n(last.d_cnt_cum); const u_cnt   = n(last.u_cnt_cum); const r_cnt   = n(last.r_cnt_cum); const m_cnt   = n(last.m_cnt_cum);
    const d_que = n(last.d_que_cum); const u_que = n(last.u_que_cum); const r_que = n(last.r_que_cum); const m_que = n(last.m_que_cum);
    const condLabel = COND_ICONS.find(c => c.val === condition)?.label || condition;

    const hm = (h) => { const hh = Math.floor(h); const mm = Math.round((h - hh) * 60); return mm > 0 ? `${hh}時間${mm}分` : `${hh}時間`; };
    
    let log = `${dateStr} (${dayJa})\n📊 本日累計リザルト\n\n| 項目 | 内容 | 備考 |\n| :-- | --: | :-- |\n`;
    log += `| **天気** | ${weather} | ${total_que > 0 ? 'クエあり' : 'クエなし'} |\n`;
    log += `| **体調** | ${condLabel} | 睡眠: ${sleepHours}h |\n`;
    log += `| **総売上** | **${(real_sales + total_que).toLocaleString()} 円** | |\n`;
    log += `| **実質売上** | **${real_sales.toLocaleString()} 円** | クエスト含まず |\n`;
    log += `| **クエ合計** | **${total_que.toLocaleString()} 円** | |\n`;
    log += `| **総完了件数** | **${total_cnt} 件** | (D:${d_cnt} / U:${u_cnt} / R:${r_cnt} / m:${m_cnt}) |\n`;
    log += `| **1件単価平均** | **${total_cnt > 0 ? Math.round((real_sales + total_que) / total_cnt) : 0} 円** | 総売上 ÷ 総件数 |\n`;
    log += `| **総走行距離** | **${total_km} km** | |\n`;
    log += `| **実稼働時間** | **${hm(total_h)}** | |\n`;
    log += `| **時給換算** | **${jikyu.toLocaleString()} 円** | 総売上 ÷ 実稼働時間 |\n\n📦 Platform別内訳\n\n`;
    log += `| PF | 件数 | 総額 | 実質売上 | クエ |\n| :--: | --: | --: | --: | --: |\n`;
    log += `| **出前館 (D)** | ${d_cnt} 件 | ${(d_total+d_que).toLocaleString()} 円 | ${d_total.toLocaleString()} 円 | ${d_que.toLocaleString()} 円 |\n`;
    log += `| **Uber Eats (U)** | ${u_cnt} 件 | ${(u_total+u_que).toLocaleString()} 円 | ${u_total.toLocaleString()} 円 | ${u_que.toLocaleString()} 円 |\n`;
    log += `| **RocketNow (R)** | ${r_cnt} 件 | ${(r_total+r_que).toLocaleString()} 円 | ${r_total.toLocaleString()} 円 | ${r_que.toLocaleString()} 円 |\n`;
    log += `| **menu (m)** | ${m_cnt} 件 | ${(m_total+m_que).toLocaleString()} 円 | ${m_total.toLocaleString()} 円 | ${m_que.toLocaleString()} 円 |\n\n🕒 各セット詳細\n\n`;

    calced.forEach((s, i) => {
      const sp = s.d_p + s.u_p + s.r_p + s.m_p; const sc = s.d_c + s.u_c + s.r_c + s.m_c;
      const pf_parts = []; if (s.d_c > 0) pf_parts.push("D:" + s.d_c); if (s.u_c > 0) pf_parts.push("U:" + s.u_c); if (s.r_c > 0) pf_parts.push("R:" + s.r_c); if (s.m_c > 0) pf_parts.push("m:" + s.m_c);
      log += `- **第${i+1}セット ${s.start || '--:--'} 〜 ${s.end || '--:--'}** ${s.dur ? `(${s.dur.h>0?s.dur.h+'h':''}${s.dur.m}m)` : ''}\n`;
      log += `  - **実績**：${sc}件 / ${sp.toLocaleString()}円${s.km_p > 0 ? ` / ${s.km_p}km` : ''} ${pf_parts.length>0 ? `(${pf_parts.join(' / ')})` : ''}\n`;
      if (s.memo) log += `  - **戦術**：${s.memo}\n`;
      log += '\n';
    });

    if (dailyMemo && dailyMemo.trim()) {
      log += `📝 本日の気づき・戦術メモ\n\n${dailyMemo.trim()}\n\n`;
    }

    return log.trim();
  };

  const periodLabels = { day: '本日', week: '今週', month: '今月累計', year: '今年累計' };
  const currentNavText = { day: periodMeta.dayStr, week: periodMeta.weekStr, month: periodMeta.monthStr, year: periodMeta.yearStr }[period];

  const formatHours = (h) => {

        {activeTab === 'dashboard' && (

        {activeTab === 'dashboard' && (

              <div class="sum-item"><div class="sum-label">実質売上</div><div class="sum-val">{activePeriodData.real.toLocaleString()}円</div></div>
              <div class="sum-item"><div class="sum-label">クエ合計</div><div class="sum-val teal">{activePeriodData.que.toLocaleString()}円</div></div>
            </div>

            </div>
            <div class="sum-row">
              <div class="sum-item"><div class="sum-label">1件単価</div><div class="sum-val">{activePeriodData.cnt > 0 ? activePeriodData.tanka.toLocaleString()+'円' : '-'}</div></div>
              <div class="sum-item"><div class="sum-label">クエ抜き単価</div><div class="sum-val">{activePeriodData.cnt > 0 ? activePeriodData.realTanka.toLocaleString()+'円' : '-'}</div></div>
            </div>
            {/* 実働時間 / 時給換算 */}
            <div class="sum-row">
              <div class="sum-item">
                <div class="sum-label">実働時間</div>
                <div class="sum-val">{activePeriodData.hours > 0 ? formatHours(activePeriodData.hours) : '-'}</div>
              </div>
              <div class="sum-item"><div class="sum-label">時給換算</div><div class="sum-val yellow">{activePeriodData.hours > 0 ? activePeriodData.periodJikyu.toLocaleString()+'円' : '-'}</div></div>

              <div class="sum-item"><div class="sum-label">キロ単価</div><div class="sum-val">{activePeriodData.kmTanka > 0 ? `${activePeriodData.kmTanka.toLocaleString()}円/km` : '-'}</div></div>
            </div>
          </div>

        {/* 🌓 週モード限定：【平日】＆【週末】分割集計 */}
        {activeTab === 'dashboard' && period === 'week' && (

              <div class="split-sub-row">

              </div>

              <div class="split-sub-row">

                {periodicAnalysis.week.friSun.que > 0 && <span style={{color:'var(--teal)'}}>クエ: {periodicAnalysis.week.friSun.que.toLocaleString()}円</span>}
              </div>

                <span>⏱️ {formatHours(periodicAnalysis.week.friSun.hours)}</span>

              </div>
            </div>

        {/* 🎯 GOAL PANEL (目標パネルを上に配置) */}
        {activeTab === 'dashboard' && (
          <div class="goal-panel">
            <div class="goal-inputs-container">

                <div class="goal-input-wrapper">
                  <input class="goal-input" type="number" value={activePeriodData.goalAmt || ''} onChange={e => updatePeriodicGoal('amt', e.target.value)} placeholder="未設定" />
                  <span style={{fontSize:'14px', color:'var(--muted)'}}>円</span>
                </div>
              </div>
              <div class="goal-input-row">
                <div class="goal-title-flex"><span>📦 {periodLabels[period]}目標件数</span></div>
                <div class="goal-input-wrapper">
                  <input class="goal-input" type="number" value={activePeriodData.goalCnt || ''} onChange={e => updatePeriodicGoal('cnt', e.target.value)} placeholder="未設定" />
                  <span style={{fontSize:'14px', color:'var(--muted)'}}>件</span>
                </div>
              </div>
            </div>
            
            {activePeriodData.goalAmt > 0 && (
              <div class="progress-section">
                <div class="progress-track"><div class="progress-bar" style={{ width: `${activePeriodData.percentAmt}%` }}></div></div>
                <div class="goal-footer-row">
                  <div class="goal-footer-top">
                    <div class="goal-status-text">金額達成率 <strong>{activePeriodData.percentAmt}%</strong></div>

                  {/* ⚡ パターンB: プラットフォーム別 目安必要件数の即時換算 */}
                  {activePeriodData.remainAmt > 0 && (
                    <div class="goal-footer-sub">
                      <span style={{ color: 'var(--muted)' }}>目安残数:</span>

                <div class="goal-footer-row">
                  <div class="goal-footer-top">
                    <div class="goal-status-text">件数達成率 <strong>{activePeriodData.percentCnt}%</strong></div>
                    {activePeriodData.remainCnt <= 0 ? (
                      <div class="goal-remain-text done">🎉 件数目標達成！</div>
                    ) : (
                      <div class="goal-remain-text remain">残り {activePeriodData.remainCnt} 件</div>

        {/* ── TAB 1: DASHBOARD (HOME) ── */}

                          {s.start && s.end && <span class="set-badge done">完了</span>}
                        </div>
                        <span class="chevron">{s.open ? '▲' : '▼'}</span>
                      </div>
                      <div class="set-summary-row1">{s.sc} 件 / {s.sp.toLocaleString()} 円</div>
                      <div class="set-summary-row2">
                        <span class="set-summary-tag">⏱️ {durText}</span>
                        <span class="set-summary-tag">💴 時給 {s.setJikyu > 0 ? s.setJikyu.toLocaleString() + '円' : '-'}</span>
                      </div>
                    </div>

                    {s.open && (
                      <div style={{padding:'16px'}}>
                        <div class="time-row">
                          <div>
                            <label>開始時刻</label>
                            <div class="time-field">
                              <input type="time" value={sets[i].start} onChange={e => updateSet(i,'start',e.target.value)} />
                              <button class="stamp-btn" onClick={() => updateSet(i,'start',getNow())}>NOW</button>
                            </div>
                          </div>
                          <div>
                            <label>終了時刻</label>
                            <div class="time-field">
                              <input type="time" value={sets[i].end} onChange={e => updateSet(i,'end',e.target.value)} />
                              <button class="stamp-btn secondary" onClick={() => updateSet(i,'end',getNow())}>FIN</button>
                            </div>
                          </div>
                        </div>

                        {PLATFORMS.map(p => (
                          <div key={p.key} class="platform-block" style={{background: p.color+'06', borderColor: p.color+'25'}}>
                            <div class="platform-title" style={{color: p.color}}>
                              <span>{p.label}</span>
                              <span class="diff-badge">+{s[p.key+'_p'].toLocaleString()}円 / {s[p.key+'_c']}件</span>
                            </div>
                            <div class="pf-inputs">
                              <div><label>売上(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cum'] || ''} onChange={e => updateSet(i, p.key+'_cum', e.target.value)} /></div>
                              <div><label>件数(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cnt_cum'] || ''} onChange={e => updateSet(i, p.key+'_cnt_cum', e.target.value)} /></div>
                              <div><label>クエ(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_que_cum'] || ''} onChange={e => updateSet(i, p.key+'_que_cum', e.target.value)} /></div>
                            </div>
                          </div>
                        ))}

                        <div class="grid-2" style={{margin: '12px 0'}}>
                          <div><label>走行距離累積 (km)</label><input type="number" placeholder="0" value={sets[i].km_cum} onChange={e => updateSet(i,'km_cum',e.target.value)} /></div>
                          <div><label>区間距離</label><div style={{paddingTop:'14px', color:'var(--teal)', fontWeight:'800', fontFamily:'var(--font-mono)'}}>{s.km_p > 0 ? `+${s.km_p} km` : '-'}</div></div>
                        </div>

                        <div style={{marginTop:'10px'}}><label>戦術メモ</label><textarea rows="2" placeholder="メモ記入" value={sets[i].memo} onChange={e => updateSet(i,'memo',e.target.value)} /></div>
                        {sets.length > 1 && <button class="del-btn" onClick={() => deleteSet(i)}>SET {i+1} を削除</button>}
                      </div>
                    )}
                  </div>
                );
              })}
              <button class="add-btn" onClick={addPeriodicSet}>＋ 次のセットを追加</button>

              <div style={{marginTop:'24px', marginBottom:'24px'}}>
                <button class="gen-btn" onClick={() => setShowLog(!showLog)}>{showLog ? '報告ログを閉じる' : '🚀 V5報告ログを生成'}</button>
                {showLog && (
                  <div class="log-box">
                    <pre>{generateLog()}</pre>
                    <button class="copy-btn" onClick={() => { navigator.clipboard.writeText(generateLog()); alert('コピー完了！'); }}>ログをコピーする</button>
                  </div>
                )}
              </div>
            </>
          )}
        </div>

        {/* ── TAB 2: MEMOS / INBOX (Google Keep風ポップアップ編集) ── */}
        <div class={`view-container ${activeTab === 'memos' ? 'active' : ''}`}>
          <div class="section-title">💡 クイック新規メモ (Inbox)</div>
          <div class="card">
            <div style={{display:'flex', gap:'8px', marginBottom:'12px'}}>
              {MEMO_CATEGORIES.map(c => (
                <button key={c} class={`memo-cat-btn ${newMemoCat === c ? 'active' : ''}`} onClick={() => setNewMemoCat(c)}>{c}</button>
              ))}
            </div>
            <textarea
              class="daily-memo-textarea"
              placeholder="思いついたアイデア、買出し、備忘録などをパッと入力..."
              value={newMemoText}
              onChange={e => setNewMemoText(e.target.value)}
              style={{minHeight:'110px'}}
            />
            <button class="gen-btn" style={{marginTop:'12px', padding:'16px', fontSize:'17px'}} onClick={addInboxMemo}>メモを保存する</button>
          </div>

          <div class="section-title">🔍 メモ検索 & 一覧 (タップして全面編集)</div>
          <div style={{display:'flex', gap:'10px', marginBottom:'12px'}}>
            <input type="text" placeholder="キーワードで即座に検索..." value={memoSearch} onChange={e => setMemoSearch(e.target.value)} />
          </div>

          <div class="memo-cat-filter">
            {['すべて', ...MEMO_CATEGORIES].map(cat => (
              <button key={cat} class={`memo-cat-btn ${memoFilter === cat ? 'active' : ''}`} onClick={() => setMemoFilter(cat)}>{cat}</button>
            ))}
          </div>

          {filteredMemos.length === 0 ? (
            <div style={{textAlign:'center', padding:'40px 20px', color:'var(--muted)', fontSize:'16px'}}>該当するメモがありません</div>
          ) : (
            filteredMemos.map(m => (
              <div key={m.id} class="memo-item-card" onClick={() => setEditingMemoId(m.id)}>
                <div class="memo-item-header">
                  <span class="memo-tag-pill">{m.cat}</span>
                  <span>{m.date} {m.time}</span>
                </div>
                
                <div class="memo-preview-text">
                  {m.text || <span style={{color:'var(--muted)'}}>（内容がありません）</span>}
                </div>

                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'4px'}}>
                  <span style={{fontSize:'12px', color:'var(--muted2)'}}>👆 タップで全面編集</span>
                  <div style={{display:'flex', gap:'8px'}} onClick={e => e.stopPropagation()}>
                    <button class="stamp-btn secondary" style={{minHeight:'36px', fontSize:'12px', padding:'0 12px'}} onClick={() => { navigator.clipboard.writeText(m.text); alert('コピーしました！'); }}>コピー</button>
                    <button class="stamp-btn" style={{minHeight:'36px', fontSize:'12px', background:'rgba(255,50,50,0.2)', color:'#ff5555'}} onClick={() => deleteInboxMemo(m.id)}>削除</button>
                  </div>
                </div>
              </div>
            ))
          )}
        </div>

        {/* 🪟 全面ポップアップ編集モーダル (Google Keep風) */}
        {activeEditingMemo && (
          <div class="modal-overlay" onClick={() => setEditingMemoId(null)}>
            <div class="memo-modal-card" onClick={e => e.stopPropagation()}>
              <div class="modal-header">
                <div style={{display:'flex', gap:'6px', overflowX:'auto'}}>
                  {MEMO_CATEGORIES.map(c => (
                    <button
                      key={c}
                      class={`memo-cat-btn ${activeEditingMemo.cat === c ? 'active' : ''}`}
                      style={{padding:'6px 12px', fontSize:'13px'}}
                      onClick={() => setInboxMemoCat(activeEditingMemo.id, c)}
                    >
                      {c}
                    </button>
                  ))}
                </div>
                <button
                  class="stamp-btn secondary"
                  style={{minHeight:'38px', padding:'0 14px', fontSize:'14px', borderRadius:'8px'}}
                  onClick={() => setEditingMemoId(null)}
                >
                  完了
                </button>
              </div>

              <div class="modal-body">
                <textarea
                  class="modal-textarea"
                  placeholder="メモを入力..."
                  value={activeEditingMemo.text}
                  onChange={e => updateInboxMemoText(activeEditingMemo.id, e.target.value)}
                  autoFocus
                />
              </div>

              <div class="modal-footer">
                <span style={{fontSize:'13px', color:'var(--muted)'}}>{activeEditingMemo.date} {activeEditingMemo.time}</span>
                <div style={{display:'flex', gap:'8px'}}>
                  <button
                    class="stamp-btn secondary"
                    style={{minHeight:'38px', fontSize:'13px', padding:'0 14px'}}
                    onClick={() => { navigator.clipboard.writeText(activeEditingMemo.text); alert('コピーしました！'); }}
                  >
                    コピー
                  </button>
                  <button
                    class="stamp-btn"
                    style={{minHeight:'38px', fontSize:'13px', background:'rgba(255,50,50,0.2)', color:'#ff5555', padding:'0 14px'}}
                    onClick={() => deleteInboxMemo(activeEditingMemo.id)}
                  >
                    削除
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── TAB 3: CALENDAR ── */}
        <div class={`view-container ${activeTab === 'calendar' ? 'active' : ''}`}>
          <div class="cal-header-container">
            <div class="cal-title-nav">
              <button class="cal-nav-btn" onClick={() => handleCalendarMonthChange(-1)}>◀</button>
              <span class="cal-title-text">{calYear}年 {calMonth}月</span>
              <button class="cal-nav-btn" onClick={() => handleCalendarMonthChange(1)}>▶</button>
            </div>
            <div class="cal-monthly-total">{currentCalendarMonthTotal.toLocaleString()} 円</div>
          </div>

          <div class="card" style={{padding:'6px', marginBottom: '24px'}}>
            <div class="cal-grid">
              {['月','火','水','木','金','土','日'].map(w => <div key={w} class="cal-head-cell">{w}</div>)}
              {calendarDays.map((c, idx) => c.empty ? <div key={idx} class="cal-day-cell empty" /> : (
                <div key={idx} class={`cal-day-cell ${date === c.dateKey ? 'selected' : ''}`} onClick={() => { setDate(c.dateKey); setPeriod('day'); setActiveTab('dashboard'); }}>
                  <div class="cal-day-top">
                    <span class="cal-day-num current-month">{c.dayNum}</span>
                    {c.cond && <span class="cal-day-cond">{COND_ICONS.find(icon => icon.val === c.cond)?.label.split(' ')[0]}</span>}
                  </div>
                  <div class="cal-day-amt-box">
                    <span class="cal-day-amt">{formatSmartAmt(c.amt)}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* ── TAB 4: SETTINGS ── */}
        <div class={`view-container ${activeTab === 'settings' ? 'active' : ''}`}>
          <div class="section-title">☁️ iCloud Drive バックアップ / 同期</div>
          <div class="card" style={{borderColor:'var(--blue)', background:'rgba(41,121,255,0.03)'}}>
            <p style={{fontSize:'14px', color:'var(--muted2)', marginBottom:'14px'}}>
              稼働ログ、メモ、目標設定を含む全データを一括で保存・復元します。
            </p>
            <div class="grid-2">
              <button class="gen-btn" style={{background:'var(--blue)'}} onClick={saveToiCloudJSON}>💾 iCloudへ完全保存</button>
              <button class="gen-btn" style={{background:'rgba(255,255,255,0.1)', color:'#fff', border:'1.5px solid var(--border)'}} onClick={() => document.getElementById('settingsCloudLoad').click()}>📥 iCloudから同期</button>
            </div>
            <input type="file" id="settingsCloudLoad" accept=".json" style={{display:'none'}} onChange={loadFromiCloudJSON} />
          </div>
          <div class="section-title">データコントロール</div>
          <div class="card">
            <button class="gen-btn" style={{background:'rgba(255,92,26,0.2)', color:'var(--accent)', border:'1.5px solid var(--accent)'}} onClick={startNewDay}>新しい営業日を開始する (4時起点)</button>
          </div>
        </div>

        {/* BOTTOM NAV TABS */}
        <nav class="bottom-nav">
          <button class={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>ホーム</span>
          </button>
          <button class={`tab-btn ${activeTab === 'memos' ? 'active' : ''}`} onClick={() => setActiveTab('memos')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span>メモ</span>
          </button>
          <button class={`tab-btn ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="18" y2="10"/></svg><span>カレンダー</span>
          </button>
          <button class={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>設定</span>
          </button>
        </nav>
      </div>
    </div>
  );
}

const EMPTY_SET = () => ({
  start: '', end: '', d_cum: '', u_cum: '', r_cum: '', m_cum: '', d_cnt_cum: '', u_cnt_cum: '', r_cnt_cum: '', m_cnt_cum: '', d_que_cum: '', u_que_cum: '', r_que_cum: '', m_que_cum: '', km_cum: '', memo: '', open: true,
});

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
