  };

  const goalStorageKey = useMemo(() => {
    const [y, m] = date.split('-');
    if (period === 'day') return `D-${date}`;
    if (period === 'week') return `W-${getYearWeekStr(date)}`;
    if (period === 'month') return `M-${y}-${m}`;
    return `Y-${y}`;
  }, [date, period]);

  const calced = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    return sets.map((s, i) => {
      const p = sets[i-1] || { d_cum:0, u_cum:0, r_cum:0, m_cum:0, d_cnt_cum:0, u_cnt_cum:0, r_cnt_cum:0, m_cnt_cum:0, d_que_cum:0, u_que_cum:0, r_que_cum:0, m_que_cum:0, km_cum:0 };
      const sp = (n(s.d_cum)-n(p.d_cum)) + (n(s.u_cum)-n(p.u_cum)) + (n(s.r_cum)-n(p.r_cum)) + (n(s.m_cum)-n(p.m_cum)) + (n(s.d_que_cum)-n(p.d_que_cum)) + (n(s.u_que_cum)-n(p.u_que_cum)) + (n(s.r_que_cum)-n(p.r_que_cum)) + (n(s.m_que_cum)-n(p.m_que_cum));
      const sc = (n(s.d_cnt_cum)-n(p.d_cnt_cum)) + (n(s.u_cnt_cum)-n(p.u_cnt_cum)) + (n(s.r_cnt_cum)-n(p.r_cnt_cum)) + (n(s.m_cnt_cum)-n(p.m_cnt_cum));
      const dur = calcDuration(s.start, s.end);
      const setJikyu = (dur && dur.total > 0) ? Math.round(sp / dur.total) : 0;
      const setTanka = sc > 0 ? Math.round(sp / sc) : 0;

      return {
        ...s,
        d_p: n(s.d_cum)-n(p.d_cum), u_p: n(s.u_cum)-n(p.u_cum), r_p: n(s.r_cum)-n(p.r_cum), m_p: n(s.m_cum)-n(p.m_cum),
        d_c: n(s.d_cnt_cum)-n(p.d_cnt_cum), u_c: n(s.u_cnt_cum)-n(p.u_cnt_cum), r_c: n(s.r_cnt_cum)-n(p.r_cnt_cum), m_c: n(s.m_cnt_cum)-n(p.m_cnt_cum),
        d_qp: n(s.d_que_cum)-n(p.d_que_cum), u_qp: n(s.u_que_cum)-n(p.u_que_cum), r_qp: n(s.r_que_cum)-n(p.r_que_cum), m_qp: n(s.m_que_cum)-n(p.m_que_cum),
        km_p: n(s.km_cum)-n(p.km_cum), dur, setJikyu, setTanka, sp, sc
      };
    });
  }, [sets]);

  const daySummary = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    const last = sets[sets.length - 1] || EMPTY_SET();
    const total_sales = n(last.d_cum) + n(last.u_cum) + n(last.r_cum) + n(last.m_cum);
    const total_que   = n(last.d_que_cum) + n(last.u_que_cum) + n(last.r_que_cum) + n(last.m_que_cum);
    const total_cnt   = n(last.d_cnt_cum) + n(last.u_cnt_cum) + n(last.r_cnt_cum) + n(last.m_cnt_cum);
    const total_km    = n(last.km_cum);
    const total_h     = calced.reduce((a, s) => a + (s.dur ? s.dur.total : 0), 0);
    return { total_sales: total_sales + total_que, real_sales: total_sales, total_que, total_cnt, total_km, total_h, jikyu: total_h > 0 ? Math.round((total_sales + total_que) / total_h) : 0 };
  }, [sets, calced]);

  const periodMeta = useMemo(() => {
    const current = new Date(date);
    const day = current.getDay();
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const mon = new Date(current.getTime() + mondayOffset * 86400000);
    const sun = new Date(mon.getTime() + 6 * 86400000);
    const [y, m, d] = date.split('-');
    const dayJa = ['日','月','火','水','木','金','土'][current.getDay()];

    return {
      dayStr: `${y}/${m}/${d} (${dayJa})`,
      weekStr: `${mon.getFullYear()}年 第${getYearWeekStr(date).split('-W')[1]}週 (${String(mon.getMonth()+1).padStart(2,'0')}/${String(mon.getDate()).padStart(2,'0')}〜${String(sun.getMonth()+1).padStart(2,'0')}/${String(sun.getDate()).padStart(2,'0')})`,
      monthStr: `${y}年 ${m}月 累計`,
      yearStr: `${y}年 年間累計`,
      monRef: mon, sunRef: sun,
      dayOfWeek: day
    };
  }, [date]);

  const periodicAnalysis = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    const [targetYear, targetMonth] = date.split('-').map(Number);
    
    let monthTotal = 0; let monthReal = 0; let monthQue = 0; let monthCnt = 0; let monthHours = 0; let monthKm = 0;
    let weekTotal = 0; let weekReal = 0; let weekQue = 0; let weekCnt = 0; let weekHours = 0; let weekKm = 0;
    let yearTotal = 0; let yearReal = 0; let yearQue = 0; let yearCnt = 0; let yearHours = 0; let yearKm = 0;

    let weekMonThu = { total: 0, real: 0, que: 0, cnt: 0, hours: 0, km: 0 };
    let weekFriSun = { total: 0, real: 0, que: 0, cnt: 0, hours: 0, km: 0 };

    const createPfBuffer = () => ({ d: { s:0, c:0 }, u: { s:0, c:0 }, r: { s:0, c:0 }, m: { s:0, c:0 } });
    const weekPf = createPfBuffer();
    const monthPf = createPfBuffer();
    const yearPf = createPfBuffer();

    Object.keys(vault).forEach(dKey => {
      const [y, m] = dKey.split('-').map(Number);
      const dayVault = vault[dKey]; const sList = dayVault.sets || []; if (sList.length === 0) return;

      const lastS = sList[sList.length - 1];
      const sales = n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum);
      const que = n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum);
      const cnt = n(lastS.d_cnt_cum) + n(lastS.u_cnt_cum) + n(lastS.r_cnt_cum) + n(lastS.m_cnt_cum);
      const km = n(lastS.km_cum);
      const totalAmt = sales + que;

      const dayCalced = sList.map(s => ({ dur: calcDuration(s.start, s.end) }));
      const dayTotalHours = dayCalced.reduce((a, s) => a + (s.dur ? s.dur.total : 0), 0);

      const getPfData = (k) => ({
        sales: n(lastS[k+'_cum']) + n(lastS[k+'_que_cum']),
        cnt: n(lastS[k+'_cnt_cum'])
      });

      if (y === targetYear) {
        yearTotal += totalAmt; yearReal += sales; yearQue += que; yearCnt += cnt; yearHours += dayTotalHours; yearKm += km;
        PLATFORMS.forEach(p => {
          const pData = getPfData(p.key);
          yearPf[p.key].s += pData.sales; yearPf[p.key].c += pData.cnt;
        });

        if (m === targetMonth) {
          monthTotal += totalAmt; monthReal += sales; monthQue += que; monthCnt += cnt; monthHours += dayTotalHours; monthKm += km;
          PLATFORMS.forEach(p => {
            const pData = getPfData(p.key);
            monthPf[p.key].s += pData.sales; monthPf[p.key].c += pData.cnt;
          });
        }
      }

      const thisDate = new Date(dKey + 'T00:00:00');
      const monMidnight = new Date(periodMeta.monRef); monMidnight.setHours(0,0,0,0);
      const sunMidnight = new Date(periodMeta.sunRef); sunMidnight.setHours(23,59,59,999);

      if (thisDate >= monMidnight && thisDate <= sunMidnight) {
        weekTotal += totalAmt; weekReal += sales; weekQue += que; weekCnt += cnt; weekHours += dayTotalHours; weekKm += km;
        PLATFORMS.forEach(p => {
          const pData = getPfData(p.key);
          weekPf[p.key].s += pData.sales; weekPf[p.key].c += pData.cnt;
        });

        const dayOfWeek = thisDate.getDay();
        if (dayOfWeek >= 1 && dayOfWeek <= 4) {
          weekMonThu.total += totalAmt; weekMonThu.real += sales; weekMonThu.que += que; weekMonThu.cnt += cnt; weekMonThu.hours += dayTotalHours; weekMonThu.km += km;
        } else {
          weekFriSun.total += totalAmt; weekFriSun.real += sales; weekFriSun.que += que; weekFriSun.cnt += cnt; weekFriSun.hours += dayTotalHours; weekFriSun.km += km;
        }
      }
    });

    const lastDayS = sets[sets.length - 1] || EMPTY_SET();
    const dayPf = createPfBuffer();
    PLATFORMS.forEach(p => {
      dayPf[p.key].s = n(lastDayS[p.key+'_cum']) + n(lastDayS[p.key+'_que_cum']);
      dayPf[p.key].c = n(lastDayS[p.key+'_cnt_cum']);
    });

    return { 
      day: { total: daySummary.total_sales, real: daySummary.real_sales, que: daySummary.total_que, cnt: daySummary.total_cnt, hours: daySummary.total_h, km: daySummary.total_km, pf: dayPf },
      week: { 
        total: weekTotal, real: weekReal, que: weekQue, cnt: weekCnt, hours: weekHours, km: weekKm, pf: weekPf,
        monThu: {
          ...weekMonThu,
          jikyu: weekMonThu.hours > 0 ? Math.round(weekMonThu.total / weekMonThu.hours) : 0,
          tanka: weekMonThu.cnt > 0 ? Math.round(weekMonThu.total / weekMonThu.cnt) : 0,
          realTanka: weekMonThu.cnt > 0 ? Math.round(weekMonThu.real / weekMonThu.cnt) : 0,
          uph: weekMonThu.hours > 0 ? (weekMonThu.cnt / weekMonThu.hours).toFixed(1) : '0.0'
        },
        friSun: {
          ...weekFriSun,
          jikyu: weekFriSun.hours > 0 ? Math.round(weekFriSun.total / weekFriSun.hours) : 0,
          tanka: weekFriSun.cnt > 0 ? Math.round(weekFriSun.total / weekFriSun.cnt) : 0,
          realTanka: weekFriSun.cnt > 0 ? Math.round(weekFriSun.real / weekFriSun.cnt) : 0,
          uph: weekFriSun.hours > 0 ? (weekFriSun.cnt / weekFriSun.hours).toFixed(1) : '0.0'
        }
      },
      month: { total: monthTotal, real: monthReal, que: monthQue, cnt: monthCnt, hours: monthHours, km: monthKm, pf: monthPf },
      year: { total: yearTotal, real: yearReal, que: yearQue, cnt: yearCnt, hours: yearHours, km: yearKm, pf: yearPf }
    };
  }, [vault, date, daySummary, periodMeta, sets]);

  /* 🎯 目標・進捗 & PF別必要件数換算 & キロ単価ロジック */
  const activePeriodData = useMemo(() => {
    const data = periodicAnalysis[period];
    const rawGoal = periodicGoals[goalStorageKey];
    const goalAmt = typeof rawGoal === 'object' && rawGoal !== null ? (rawGoal.amt || 0) : Number(rawGoal || 0);
    const goalCnt = typeof rawGoal === 'object' && rawGoal !== null ? (rawGoal.cnt || 0) : 0;
    const remainAmt = goalAmt > 0 ? goalAmt - data.total : 0;
    const percentAmt = goalAmt > 0 ? Math.min(Math.round((data.total / goalAmt) * 100), 100) : 0;
    const remainCnt = goalCnt > 0 ? goalCnt - data.cnt : 0;
    const percentCnt = goalCnt > 0 ? Math.min(Math.round((data.cnt / goalCnt) * 100), 100) : 0;
    const tanka = data.cnt > 0 ? Math.round(data.total / data.cnt) : 0;
    const realTanka = data.cnt > 0 ? Math.round(data.real / data.cnt) : 0;
    const needCnt = (remainAmt > 0 && tanka > 0) ? Math.ceil(remainAmt / tanka) : 0;

    // キロ単価換算（総売上 ÷ 走行距離）
    const kmTanka = data.km > 0 ? Math.round(data.total / data.km) : 0;

    // パターンB: 稼働前は基準単価、実績が出たらリアル単価に自動連動
    const isWeekend = (periodMeta.dayOfWeek === 0 || periodMeta.dayOfWeek === 6);
    const defaultDemaeTanka = isWeekend ? 550 : 500;
    const defaultUberTanka = 350;

    const dPf = data.pf?.d || { s: 0, c: 0 };
    const uPf = data.pf?.u || { s: 0, c: 0 };

    const effectiveDTanka = dPf.c > 0 ? Math.round(dPf.s / dPf.c) : defaultDemaeTanka;
    const effectiveUTanka = uPf.c > 0 ? Math.round(uPf.s / uPf.c) : defaultUberTanka;

    const needCntD = (remainAmt > 0 && effectiveDTanka > 0) ? Math.ceil(remainAmt / effectiveDTanka) : 0;
    const needCntU = (remainAmt > 0 && effectiveUTanka > 0) ? Math.ceil(remainAmt / effectiveUTanka) : 0;

    let dailyNorma = 0;
    if (remainAmt > 0) {
      const currentRef = new Date(date);
      if (period === 'day') dailyNorma = remainAmt;
      else if (period === 'week') {
        const dayIdx = currentRef.getDay();
        const remainDays = dayIdx === 0 ? 1 : 7 - dayIdx + 1;
        dailyNorma = Math.ceil(remainAmt / remainDays);
      } else if (period === 'month') {
        const lastDay = new Date(currentRef.getFullYear(), currentRef.getMonth() + 1, 0).getDate();
        dailyNorma = Math.ceil(remainAmt / (lastDay - currentRef.getDate() + 1));
      } else if (period === 'year') {
        const lastDay = new Date(currentRef.getFullYear(), 11, 31);
        const remainDays = Math.ceil((lastDay - currentRef) / (1000 * 60 * 60 * 24)) + 1;
        dailyNorma = Math.ceil(remainAmt / remainDays);
      }
    }
    const periodJikyu = data.hours > 0 ? Math.round(data.total / data.hours) : 0;
    const uph = data.hours > 0 ? (data.cnt / data.hours).toFixed(1) : '0.0';

    return { 
      ...data, goalAmt, goalCnt, remainAmt, percentAmt, remainCnt, percentCnt, needCnt, 
      needCntD, needCntU, effectiveDTanka, effectiveUTanka, isRealD: dPf.c > 0, isRealU: uPf.c > 0,
      dailyNorma, periodJikyu, kmTanka, tanka, realTanka, uph 
    };
  }, [periodicAnalysis, period, periodicGoals, goalStorageKey, date, periodMeta]);

  const handleStepPeriod = (direction) => {
    const current = new Date(date);
    if (period === 'day') current.setDate(current.getDate() + direction);
    else if (period === 'week') current.setDate(current.getDate() + (direction * 7));
    else if (period === 'month') current.setMonth(current.getMonth() + direction);
    else if (period === 'year') current.setFullYear(current.getFullYear() + direction);
    setDate(formatDateToParam(current));
  };

  const handleCalendarMonthChange = (direction) => {
    let nextMonth = calMonth + direction; let nextYear = calYear;
    if (nextMonth < 1) { nextMonth = 12; nextYear -= 1; }
    else if (nextMonth > 12) { nextMonth = 1; nextYear += 1; }
    setCalYear(nextYear); setCalMonth(nextMonth);
  };

  const startNewDay = () => {
    const targetDate = getBusinessDateStr();
    if (date === targetDate) {
      if (!window.confirm('現在の最新営業日データを完全にクリアしてリセットしますか？')) return;
      setIsDirty(true);
      setVault(prev => ({ ...prev, [targetDate]: { weather: '晴', condition: 4, sleepHours: 7, goalAmt: 0, dailyMemo: '', sets: [EMPTY_SET()] } }));
    } else { setDate(targetDate); }
    setActiveTab('dashboard'); setPeriod('day');
  };

  const deleteSet = (i) => {
    if (sets.length <= 1) return;
    if (!window.confirm(`SET ${i+1} を削除しますか？`)) return;
    setIsDirty(true);
    updateDayField('sets', sets.filter((_, idx) => idx !== i));
  };

  const currentCalendarMonthTotal = useMemo(() => {
    const n = v => parseFloat(v) || 0;
    let total = 0;
    Object.keys(vault).forEach(dKey => {
      const [y, m] = dKey.split('-').map(Number);
      if (y === calYear && m === calMonth) {
        const dayVault = vault[dKey]; const sList = dayVault.sets || [];
        if (sList.length > 0) {
          const lastS = sList[sList.length - 1];
          total += (n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum)) + (n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum));
        }
      }
    });
    return total;
  }, [vault, calYear, calMonth]);

  const addPeriodicSet = () => {
    setIsDirty(true);
    const last = sets[sets.length - 1] || EMPTY_SET();
    updateDayField('sets', [...sets, {
      ...EMPTY_SET(),
      d_cum: last.d_cum, u_cum: last.u_cum, r_cum: last.r_cum, m_cum: last.m_cum,
      d_cnt_cum: last.d_cnt_cum, u_cnt_cum: last.u_cnt_cum, r_cnt_cum: last.r_cnt_cum, m_cnt_cum: last.m_cnt_cum,
      d_que_cum: last.d_que_cum, u_que_cum: last.u_que_cum, r_que_cum: last.r_que_cum, m_que_cum: last.m_que_cum,
      km_cum: last.km_cum,
    }]);
  };

  const calendarDays = useMemo(() => {
    const firstDayIndex = new Date(calYear, calMonth - 1, 1).getDay();
    const totalDays = new Date(calYear, calMonth, 0).getDate();
    const mondayBasedStartIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

    const cells = [];
    for (let i = 0; i < mondayBasedStartIndex; i++) { cells.push({ empty: true }); }
    for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
      const currentKey = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      const dayVault = vault[currentKey]; let totalSales = 0; let dayCond = null;
      if (dayVault) {
        dayCond = dayVault.condition;
        if (dayVault.sets && dayVault.sets.length > 0) {
          const n = v => parseFloat(v) || 0; const lastS = dayVault.sets[dayVault.sets.length - 1];
          totalSales = (n(lastS.d_cum) + n(lastS.u_cum) + n(lastS.r_cum) + n(lastS.m_cum)) + (n(lastS.d_que_cum) + n(lastS.u_que_cum) + n(lastS.r_que_cum) + n(lastS.m_que_cum));
        }
      }
      cells.push({ empty: false, dayNum, dateKey: currentKey, amt: totalSales, cond: dayCond });
    }
    return cells;
  }, [vault, calYear, calMonth]);

  const saveToiCloudJSON = () => {
    if (expenseState.error) { alert(expenseState.error); return; }
    if(planState.error) {alert(planState.error);return;}
    const backup = { vault, periodicGoals, memos, expenses, planning, version: 16 };
    const dataStr = JSON.stringify(backup, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob); const link = document.createElement("a");
    link.setAttribute("href", url); link.setAttribute("download", "delilog_master_backup.json");
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setIsDirty(false);
  };

  const loadFromiCloudJSON = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        if(data.version && ![13,14,15,16].includes(data.version)) throw Error('未対応のバージョン');
        const restoredPlanning = data.planning ? pvalidate(data.planning) : null;
        if(data.version>=15 && !restoredPlanning) throw Error('計画データがありません');
        const rv=data.vault||data;
        if(!rv || typeof rv!=='object' || Array.isArray(rv)) throw Error('記録形式が不正');
        for(const [d,v] of Object.entries(rv)) if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!v||!Array.isArray(v.sets)) throw Error('営業日データが不正');
        if(data.periodicGoals && (typeof data.periodicGoals!=='object'||Array.isArray(data.periodicGoals))) throw Error('目標形式が不正');
        if(data.memos && !Array.isArray(data.memos)) throw Error('メモ形式が不正');
        if(restoredPlanning) {const err=plinkCheck(restoredPlanning,rv);if(err)throw Error(err);}

        const restoredExpenses = data.vault && Object.prototype.hasOwnProperty.call(data, 'expenses') ? cleanExpenses(data.expenses) : null;
        if(restoredPlanning) localStorage.setItem(PLAN_KEY, JSON.stringify(restoredPlanning));
        if (restoredExpenses !== null) {
          localStorage.setItem(SK.expenses, JSON.stringify(restoredExpenses));
          setExpenseState({items: restoredExpenses, error: ''});
        }
        if(restoredPlanning) setPlanState({data:restoredPlanning,error:''});
        if (data.vault) {
          setVault(data.vault);
          if (data.periodicGoals) setPeriodicGoals(data.periodicGoals);
          if (data.memos) setMemos(data.memos);
        } else {
          setVault(data);
        }
        setIsDirty((restoredExpenses === null && expenses.length > 0) || !restoredPlanning); alert(restoredExpenses === null ? "復元しました。経費を含まない旧バックアップのため、現在の経費は保持しました。" : "バックアップから復元しました。計画を含まない旧形式では現在の計画設定を保持します。");
      } catch (err) { alert("同期に失敗しました。形式をご確認ください。"); }
    };
    reader.readAsText(file); e.target.value = '';
  };

  const addInboxMemo = () => {
    if (!newMemoText.trim()) return;
    const newEntry = {
      id: Date.now(),
      date: getBusinessDateStr(),
      time: getNow(),
      cat: newMemoCat,
      text: newMemoText.trim()
    };
    setMemos(prev => [newEntry, ...prev]);
    setNewMemoText('');
    setIsDirty(true);
  };

  const updateInboxMemoText = (id, newText) => {
    setIsDirty(true);
    setMemos(prev => prev.map(m => m.id === id ? { ...m, text: newText } : m));
  };

  const setInboxMemoCat = (id, newCat) => {
    setIsDirty(true);
    setMemos(prev => prev.map(m => m.id === id ? { ...m, cat: newCat } : m));
  };

  const deleteInboxMemo = (id) => {
    if (!window.confirm('このメモを削除しますか？')) return;
    setMemos(prev => prev.filter(m => m.id !== id));
    if (editingMemoId === id) setEditingMemoId(null);
    setIsDirty(true);
  };

  const filteredMemos = useMemo(() => {
    return memos.filter(m => {
      const matchCat = memoFilter === 'すべて' || m.cat === memoFilter;
      const matchText = !memoSearch.trim() || m.text.toLowerCase().includes(memoSearch.toLowerCase());
      return matchCat && matchText;
    });
  }, [memos, memoFilter, memoSearch]);

  const activeEditingMemo = useMemo(() => {
    return memos.find(m => m.id === editingMemoId) || null;
  }, [memos, editingMemoId]);

  const generateLog = () => {
    const n = v => parseFloat(v) || 0;
    const { real_sales, total_que, total_cnt, total_km, total_h, jikyu } = daySummary;
    const dayJa = ['日','月','火','水','木','金','土'][new Date(date).getDay()];
    const dateStr = date.replace(/-/g,'/');

    const last = sets[sets.length - 1] || EMPTY_SET();
    const d_total = n(last.d_cum); const u_total = n(last.u_cum); const r_total = n(last.r_cum); const m_total = n(last.m_cum);
    const d_cnt   = n(last.d_cnt_cum); const u_cnt   = n(last.u_cnt_cum); const r_cnt   = n(last.r_cnt_cum); const m_cnt   = n(last.m_cnt_cum);
    const d_que = n(last.d_que_cum); const u_que = n(last.u_que_cum); const r_que = n(last.r_que_cum); const m_que = n(last.m_que_cum);
    const condLabel = COND_ICONS.find(c => c.val === condition)?.label || condition;

    const hm = (h) => { const hh = Math.floor(h); const mm = Math.round((h - hh) * 60); return mm > 0 ? `${hh}時間${mm}分` : `${hh}時間`; };
    
    let log = `${dateStr} (${dayJa})\n📊 本日累計リザルト\n\n| 項目 | 内容 | 備考 |\n| :-- | --: | :-- |\n`;
    log += `| **天気** | ${weather} | ${total_que > 0 ? 'クエあり' : 'クエなし'} |\n`;
    log += `| **体調** | ${condLabel} | 睡眠: ${sleepHours}h |\n`;
    log += `| **総売上** | **${(real_sales + total_que).toLocaleString()} 円** | |\n`;
    log += `| **実質売上** | **${real_sales.toLocaleString()} 円** | クエスト含まず |\n`;
    log += `| **クエ合計** | **${total_que.toLocaleString()} 円** | |\n`;
    log += `| **総完了件数** | **${total_cnt} 件** | (D:${d_cnt} / U:${u_cnt} / R:${r_cnt} / m:${m_cnt}) |\n`;
    log += `| **1件単価平均** | **${total_cnt > 0 ? Math.round((real_sales + total_que) / total_cnt) : 0} 円** | 総売上 ÷ 総件数 |\n`;
    log += `| **総走行距離** | **${total_km} km** | |\n`;
    log += `| **実稼働時間** | **${hm(total_h)}** | |\n`;
    log += `| **時給換算** | **${jikyu.toLocaleString()} 円** | 総売上 ÷ 実稼働時間 |\n\n📦 Platform別内訳\n\n`;
    log += `| PF | 件数 | 総額 | 実質売上 | クエ |\n| :--: | --: | --: | --: | --: |\n`;
    log += `| **出前館 (D)** | ${d_cnt} 件 | ${(d_total+d_que).toLocaleString()} 円 | ${d_total.toLocaleString()} 円 | ${d_que.toLocaleString()} 円 |\n`;
    log += `| **Uber Eats (U)** | ${u_cnt} 件 | ${(u_total+u_que).toLocaleString()} 円 | ${u_total.toLocaleString()} 円 | ${u_que.toLocaleString()} 円 |\n`;
    log += `| **RocketNow (R)** | ${r_cnt} 件 | ${(r_total+r_que).toLocaleString()} 円 | ${r_total.toLocaleString()} 円 | ${r_que.toLocaleString()} 円 |\n`;
    log += `| **menu (m)** | ${m_cnt} 件 | ${(m_total+m_que).toLocaleString()} 円 | ${m_total.toLocaleString()} 円 | ${m_que.toLocaleString()} 円 |\n\n🕒 各セット詳細\n\n`;

    calced.forEach((s, i) => {
      const sp = s.d_p + s.u_p + s.r_p + s.m_p; const sc = s.d_c + s.u_c + s.r_c + s.m_c;
      const pf_parts = []; if (s.d_c > 0) pf_parts.push("D:" + s.d_c); if (s.u_c > 0) pf_parts.push("U:" + s.u_c); if (s.r_c > 0) pf_parts.push("R:" + s.r_c); if (s.m_c > 0) pf_parts.push("m:" + s.m_c);
      log += `- **第${i+1}セット ${s.start || '--:--'} 〜 ${s.end || '--:--'}** ${s.dur ? `(${s.dur.h>0?s.dur.h+'h':''}${s.dur.m}m)` : ''}\n`;
      log += `  - **実績**：${sc}件 / ${sp.toLocaleString()}円${s.km_p > 0 ? ` / ${s.km_p}km` : ''} ${pf_parts.length>0 ? `(${pf_parts.join(' / ')})` : ''}\n`;
      if (s.memo) log += `  - **戦術**：${s.memo}\n`;
      log += '\n';
    });

    if (dailyMemo && dailyMemo.trim()) {
      log += `📝 本日の気づき・戦術メモ\n\n${dailyMemo.trim()}\n\n`;
    }

    return log.trim();
  };

  const periodLabels = { day: '本日', week: '今週', month: '今月累計', year: '今年累計' };
  const currentNavText = { day: periodMeta.dayStr, week: periodMeta.weekStr, month: periodMeta.monthStr, year: periodMeta.yearStr }[period];

  const formatHours = (h) => {
    if (!h || h <= 0) return '0h';
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    return mm > 0 ? `${hh}h${mm}m` : `${hh}h`;
  };

  return (
    <div class="app-shell">
      {/* SIDEBAR (PC PANEL) */}
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">🛵</div>
          <div>
            <div class="brand-title">DELIVERY LOG</div>
            <p style={{fontSize:'10px', color:'var(--muted)'}}>デリログ // V13 PRO</p>
          </div>
        </div>
        <nav class="nav-menu">
          <button class={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>🛵 稼働</button>
          <button class={`nav-item ${activeTab === 'memos' ? 'active' : ''}`} onClick={() => setActiveTab('memos')}>📝 メモ / Inbox</button>
          <button class={`nav-item ${activeTab === 'expenses' ? 'active' : ''}`} onClick={() => setActiveTab('expenses')}>🧾 経費</button>
          <button class={`nav-item ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>📅 カレンダー</button>
          <button class={`nav-item ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>⚙️ 設定・同期</button>
          <button className={`nav-item ${activeTab==='simulation'?'active':''}`} aria-current={activeTab==='simulation'?'page':undefined} onClick={() => setActiveTab('simulation')}>🧮 売上管理</button>
        </nav>
      </aside>

      {/* MAIN LAYOUT CONTENT */}
      <div class="main-content">
        <header class="topbar">
          <div>
            <p>Target // {date.replace(/-/g,'/')}</p>
            <h1>{activeTab==='simulation'?'🧮 売上管理':activeTab==='dashboard'?'🛵 稼働':'🛵 DELIVERY LOG'}</h1>
          </div>
          <div style={{display:'flex', gap:'10px'}}>
            {isDirty ? (
              <div class="cloud-indicator unsaved" onClick={saveToiCloudJSON} style={{cursor:'pointer'}}>JSON未出力（保存）</div>
            ) : (
              <div class="cloud-indicator">端末保存済み</div>
            )}
          </div>
        </header>

        {/* 📅 PERIOD SWITCHER TABS & NAVIGATION */}
        {activeTab === 'dashboard' && (
          <div class="period-switcher-container">
            <div class="period-tabs">
              <button class={`period-tab ${period === 'day' ? 'active' : ''}`} onClick={() => setPeriod('day')}>日</button>
              <button class={`period-tab ${period === 'week' ? 'active' : ''}`} onClick={() => setPeriod('week')}>週</button>
              <button class={`period-tab ${period === 'month' ? 'active' : ''}`} onClick={() => setPeriod('month')}>月</button>
              <button class={`period-tab ${period === 'year' ? 'active' : ''}`} onClick={() => setPeriod('year')}>年</button>
            </div>
            
            <div class="period-nav-bar">
              <button class="period-nav-btn" onClick={() => handleStepPeriod(-1)}>◀</button>
              <div class="period-nav-display">{currentNavText}</div>
              <button class="period-nav-btn" onClick={() => handleStepPeriod(1)}>▶</button>
            </div>
          </div>
        )}

        <Planner view={activeTab} vault={vault} goals={periodicGoals} date={date} p={planning} onChange={savePlanning} onGoalsChange={next=>{setPeriodicGoals(next);setIsDirty(true);}} navigate={setActiveTab} onActualDate={d=>{setDate(d);setPeriod('day');setActiveTab('dashboard');setTimeout(()=>document.getElementById('delivery-set-entry')?.scrollIntoView({behavior:'smooth'}),100);}} error={planState.error} today={today} />

        {/* 📊 iPhone-first LIVE SUMMARY HEADER */}
        {activeTab === 'dashboard' && (
          <>
            <div class="summary-bar">
              <div class="sum-row"><div class="sum-item"><div class="sum-label">総売上</div><div class="sum-val accent">{activePeriodData.total.toLocaleString()}円</div></div></div>
              <div class="sum-row">
                <div class="sum-item"><div class="sum-label">配達件数</div><div class="sum-val green">{activePeriodData.cnt}件</div></div>
                <div class="sum-item"><div class="sum-label">実働時間</div><div class="sum-val">{activePeriodData.hours > 0 ? formatHours(activePeriodData.hours) : '-'}</div></div>
              </div>
              <div class="sum-row">
                <div class="sum-item"><div class="sum-label">UPH</div><div class="sum-val teal">{activePeriodData.uph}</div></div>
                <div class="sum-item"><div class="sum-label">時給換算</div><div class="sum-val yellow">{activePeriodData.hours > 0 ? activePeriodData.periodJikyu.toLocaleString()+'円' : '-'}</div></div>
              </div>
              <div class="sum-row">
                <div class="sum-item"><div class="sum-label">実質売上</div><div class="sum-val">{activePeriodData.real.toLocaleString()}円</div></div>
                <div class="sum-item"><div class="sum-label">クエ抜き単価</div><div class="sum-val">{activePeriodData.cnt > 0 ? activePeriodData.realTanka.toLocaleString()+'円' : '-'}</div></div>
              </div>
            </div>
            <details class="summary-secondary">
              <summary>その他の集計</summary>
              <div class="summary-extra">
                <div class="sum-row"><span>走行距離</span><span class="sum-val">{activePeriodData.km > 0 ? activePeriodData.km+'km' : '-'}</span></div>
                <div class="sum-row"><span>キロ単価</span><span class="sum-val">{activePeriodData.kmTanka > 0 ? activePeriodData.kmTanka.toLocaleString()+'円/km' : '-'}</span></div>
                <div class="sum-row"><span>1件単価</span><span class="sum-val">{activePeriodData.cnt > 0 ? activePeriodData.tanka.toLocaleString()+'円' : '-'}</span></div>
                <div class="sum-row"><span>クエスト合計</span><span class="sum-val">{activePeriodData.que.toLocaleString()}円</span></div>
              </div>
            </details>
            {period === 'day' && <button class="quick-log-btn" onClick={() => document.getElementById('delivery-set-entry')?.scrollIntoView({behavior:'smooth',block:'start'})}>＋ 稼働セットを入力</button>}
          </>
        )}

        {/* 🌓 週モード限定：【平日】＆【週末】分割集計 */}
        {activeTab === 'dashboard' && period === 'week' && (
          <div class="week-split-container">
            <div class="split-card">
              <div class="split-title weekday">📅 平日 (月〜木)</div>
              <div class="split-main-amt">{periodicAnalysis.week.monThu.total.toLocaleString()} <span style={{fontSize:'13px', fontWeight:'normal', color:'var(--muted2)'}}>円</span></div>
              <div class="split-sub-row">
                <span>実質: <strong>{periodicAnalysis.week.monThu.real.toLocaleString()}</strong>円</span>
                {periodicAnalysis.week.monThu.que > 0 && <span style={{color:'var(--teal)'}}>クエ: {periodicAnalysis.week.monThu.que.toLocaleString()}円</span>}
              </div>
              <div class="split-sub-metrics">
                <span>📦 <strong>{periodicAnalysis.week.monThu.cnt}</strong>件</span>
                <span>⏱️ {formatHours(periodicAnalysis.week.monThu.hours)}</span>
                <span>⚡ UPH {periodicAnalysis.week.monThu.uph}</span>
                <span>💴 時給 {periodicAnalysis.week.monThu.jikyu > 0 ? periodicAnalysis.week.monThu.jikyu.toLocaleString()+'円' : '-'}</span>
              </div>
            </div>

            <div class="split-card">
              <div class="split-title weekend">🔥 週末 (金〜日)</div>
              <div class="split-main-amt">{periodicAnalysis.week.friSun.total.toLocaleString()} <span style={{fontSize:'13px', fontWeight:'normal', color:'var(--muted2)'}}>円</span></div>
              <div class="split-sub-row">
                <span>実質: <strong>{periodicAnalysis.week.friSun.real.toLocaleString()}</strong>円</span>
                {periodicAnalysis.week.friSun.que > 0 && <span style={{color:'var(--teal)'}}>クエ: {periodicAnalysis.week.friSun.que.toLocaleString()}円</span>}
              </div>
              <div class="split-sub-metrics">
                <span>📦 <strong>{periodicAnalysis.week.friSun.cnt}</strong>件</span>
                <span>⏱️ {formatHours(periodicAnalysis.week.friSun.hours)}</span>
                <span>⚡ UPH {periodicAnalysis.week.friSun.uph}</span>
                <span>💴 時給 {periodicAnalysis.week.friSun.jikyu > 0 ? periodicAnalysis.week.friSun.jikyu.toLocaleString()+'円' : '-'}</span>
              </div>
            </div>
          </div>
        )}

        {/* ── TAB 1: 稼働 (work entry) ── */}

        <div class={`view-container ${activeTab === 'dashboard' ? 'active' : ''}`}>
          
          {/* Platform breakdown: stacked cards for narrow screens */}
          <div class="section-title" style={{marginTop: 0}}>プラットフォーム別内訳</div>
          <div class="platform-overview">
            {PLATFORMS.map(p => {
              const targetPf = activePeriodData.pf?.[p.key] || { s: 0, c: 0 };
              const pfTanka = targetPf.c > 0 ? Math.round(targetPf.s / targetPf.c) : 0;
              return <div key={p.key} class="platform-overview-card" style={{borderLeftColor:p.color}}>
                <div class="platform-overview-name" style={{color:p.color}}>{p.label}</div>
                <div class="platform-overview-amount">{targetPf.s.toLocaleString()}<small> 円</small></div>
                <div class="platform-overview-stats"><span>{targetPf.c} 件</span><span>平均 {pfTanka > 0 ? pfTanka.toLocaleString()+'円/件' : '-'}</span></div>
              </div>;
            })}
          </div>

          {period === 'day' && (
            <>
              <div class="section-title">📝 本日の概要 & コンディション</div>
              <div class="card grid-3">
                <div><label>営業日</label><input type="date" value={date} onChange={e => setDate(e.target.value)} style={{borderColor:'var(--teal)'}} /></div>
                <div><label>天気</label><select value={weather} onChange={e => updateDayField('weather', e.target.value)}>{WEATHERS.map(w => <option key={w}>{w}</option>)}</select></div>
                <div><label>睡眠時間 (h)</label><input type="number" step="0.5" value={sleepHours} onChange={e => updateDayField('sleepHours', e.target.value)} /></div>
              </div>

              {/* ⚡ 体調直感タップ */}
              <div class="card" style={{padding:'14px 18px', marginTop:'-6px'}}>
                <label>本日の体調レベル (直感タップ)</label>
                <div class="condition-row">
                  {COND_ICONS.map(c => (
                    <button key={c.val} class={`cond-btn ${condition === c.val ? 'active' : ''}`} onClick={() => updateDayField('condition', c.val)}>
                      {c.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 📝 日次メモ */}
              <div class="section-title">📝 本日の気づき・日記メモ</div>
              <div class="card" style={{padding:'14px'}}>
                <textarea
                  class="daily-memo-textarea"
                  placeholder="現場での気づき、加盟店の状況、感情、トラブル、明日の課題など何でも殴り書き。"
                  value={dailyMemo}
                  onChange={e => updateDayField('dailyMemo', e.target.value)}
                />
              </div>
            </>
          )}

          {/* セット詳細 */}
          {period === 'day' && (
            <>
              <div class="section-title" id="delivery-set-entry" style={{scrollMarginTop:"90px"}}>⏱️ 稼働セットごとの詳細入力</div>
              {calced.map((s, i) => {
                const durText = s.dur ? `${s.dur.h > 0 ? s.dur.h + '時間' : ''}${s.dur.m}分` : '時間未入力';
                return (
                  <div key={i} class="set-card">
                    <div class="set-header" onClick={() => toggleOpen(i)}>
                      <div class="set-header-top">
                        <div class="set-title">
                          <span>SET {i+1}</span>
                          {s.start && !s.end && <span class="set-badge active">稼働中</span>}
                          {s.start && s.end && <span class="set-badge done">完了</span>}
                        </div>
                        <span class="chevron">{s.open ? '▲' : '▼'}</span>
                      </div>
                      <div class="set-summary-row1">{s.sc} 件 / {s.sp.toLocaleString()} 円</div>
                      <div class="set-summary-row2">
                        <span class="set-summary-tag">⏱️ {durText}</span>
                        <span class="set-summary-rates">
                          <span class="set-summary-tag">💴 時給 {s.setJikyu > 0 ? s.setJikyu.toLocaleString() + '円' : '-'}</span>
                          <span class="set-summary-tag" data-testid="set-uph">UPH {s.dur && s.dur.total > 0 ? (s.sc / s.dur.total).toFixed(1) + '件/h' : '—'}</span>
                        </span>
                      </div>
                    </div>

                    {s.open && (
                      <div style={{padding:'16px'}}>
                        <div class="time-row">
                          <div>
                            <label>開始時刻</label>
                            <div class="time-field">
                              <input type="time" value={sets[i].start} onChange={e => updateSet(i,'start',e.target.value)} />
                              <button class="stamp-btn" onClick={() => updateSet(i,'start',getNow())}>NOW</button>
                            </div>
                          </div>
                          <div>
                            <label>終了時刻</label>
                            <div class="time-field">
                              <input type="time" value={sets[i].end} onChange={e => updateSet(i,'end',e.target.value)} />
                              <button class="stamp-btn secondary" onClick={() => updateSet(i,'end',getNow())}>FIN</button>
                            </div>
                          </div>
                        </div>

                        {PLATFORMS.map(p => (
                          <div key={p.key} class="platform-block" style={{background: p.color+'06', borderColor: p.color+'25'}}>
                            <div class="platform-title" style={{color: p.color}}>
                              <span>{p.label}</span>
                              <span class="diff-badge">+{s[p.key+'_p'].toLocaleString()}円 / {s[p.key+'_c']}件</span>
                            </div>
                            <div class="pf-inputs">
                              <div><label>売上(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cum'] || ''} onChange={e => updateSet(i, p.key+'_cum', e.target.value)} /></div>
                              <div><label>件数(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cnt_cum'] || ''} onChange={e => updateSet(i, p.key+'_cnt_cum', e.target.value)} /></div>
                              <div><label>クエ(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_que_cum'] || ''} onChange={e => updateSet(i, p.key+'_que_cum', e.target.value)} /></div>
                            </div>
                          </div>
                        ))}

                        <div class="grid-2" style={{margin: '12px 0'}}>
                          <div><label>走行距離累積 (km)</label><input type="number" placeholder="0" value={sets[i].km_cum} onChange={e => updateSet(i,'km_cum',e.target.value)} /></div>
                          <div><label>区間距離</label><div style={{paddingTop:'14px', color:'var(--teal)', fontWeight:'800', fontFamily:'var(--font-mono)'}}>{s.km_p > 0 ? `+${s.km_p} km` : '-'}</div></div>
                        </div>

                        <div style={{marginTop:'10px'}}><label>戦術メモ</label><textarea rows="2" placeholder="メモ記入" value={sets[i].memo} onChange={e => updateSet(i,'memo',e.target.value)} /></div>
                        {sets.length > 1 && <button class="del-btn" onClick={() => deleteSet(i)}>SET {i+1} を削除</button>}
                      </div>
                    )}
                  </div>
                );
              })}
              <button class="add-btn" onClick={addPeriodicSet}>＋ 次のセットを追加</button>

              <div style={{marginTop:'24px', marginBottom:'24px'}}>
                <button class="gen-btn" onClick={() => setShowLog(!showLog)}>{showLog ? '報告ログを閉じる' : '🚀 V5報告ログを生成'}</button>
                {showLog && (
                  <div class="log-box">
                    <pre>{generateLog()}</pre>
                    <button class="copy-btn" onClick={() => { navigator.clipboard.writeText(generateLog()); alert('コピー完了！'); }}>ログをコピーする</button>
                  </div>
                )}
              </div>
            </>
          )}
        </div>

        {/* ── TAB 2: MEMOS / INBOX (Google Keep風ポップアップ編集) ── */}
        <div class={`view-container ${activeTab === 'memos' ? 'active' : ''}`}>
          <div class="section-title">💡 クイック新規メモ (Inbox)</div>
          <div class="card">
            <div style={{display:'flex', gap:'8px', marginBottom:'12px'}}>
              {MEMO_CATEGORIES.map(c => (
                <button key={c} class={`memo-cat-btn ${newMemoCat === c ? 'active' : ''}`} onClick={() => setNewMemoCat(c)}>{c}</button>
              ))}
            </div>
            <textarea
              class="daily-memo-textarea"
              placeholder="思いついたアイデア、買出し、備忘録などをパッと入力..."
              value={newMemoText}
              onChange={e => setNewMemoText(e.target.value)}
              style={{minHeight:'110px'}}
            />
            <button class="gen-btn" style={{marginTop:'12px', padding:'16px', fontSize:'17px'}} onClick={addInboxMemo}>メモを保存する</button>
          </div>

          <div class="section-title">🔍 メモ検索 & 一覧 (タップして全面編集)</div>
          <div style={{display:'flex', gap:'10px', marginBottom:'12px'}}>
            <input type="text" placeholder="キーワードで即座に検索..." value={memoSearch} onChange={e => setMemoSearch(e.target.value)} />
          </div>

          <div class="memo-cat-filter">
            {['すべて', ...MEMO_CATEGORIES].map(cat => (
              <button key={cat} class={`memo-cat-btn ${memoFilter === cat ? 'active' : ''}`} onClick={() => setMemoFilter(cat)}>{cat}</button>
            ))}
          </div>

          {filteredMemos.length === 0 ? (
            <div style={{textAlign:'center', padding:'40px 20px', color:'var(--muted)', fontSize:'16px'}}>該当するメモがありません</div>
          ) : (
            filteredMemos.map(m => (
              <div key={m.id} class="memo-item-card" onClick={() => setEditingMemoId(m.id)}>
                <div class="memo-item-header">
                  <span class="memo-tag-pill">{m.cat}</span>
                  <span>{m.date} {m.time}</span>
                </div>
                
                <div class="memo-preview-text">
                  {m.text || <span style={{color:'var(--muted)'}}>（内容がありません）</span>}
                </div>

                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'4px'}}>
                  <span style={{fontSize:'12px', color:'var(--muted2)'}}>👆 タップで全面編集</span>
                  <div style={{display:'flex', gap:'8px'}} onClick={e => e.stopPropagation()}>
                    <button class="stamp-btn secondary" style={{minHeight:'36px', fontSize:'12px', padding:'0 12px'}} onClick={() => { navigator.clipboard.writeText(m.text); alert('コピーしました！'); }}>コピー</button>
                    <button class="stamp-btn" style={{minHeight:'36px', fontSize:'12px', background:'rgba(255,50,50,0.2)', color:'#ff5555'}} onClick={() => deleteInboxMemo(m.id)}>削除</button>
                  </div>
                </div>
              </div>
            ))
          )}
        </div>

        {/* 🪟 全面ポップアップ編集モーダル (Google Keep風) */}
        {activeEditingMemo && (
          <div class="modal-overlay" onClick={() => setEditingMemoId(null)}>
            <div class="memo-modal-card" onClick={e => e.stopPropagation()}>
              <div class="modal-header">
                <div style={{display:'flex', gap:'6px', overflowX:'auto'}}>
                  {MEMO_CATEGORIES.map(c => (
                    <button
                      key={c}
                      class={`memo-cat-btn ${activeEditingMemo.cat === c ? 'active' : ''}`}
                      style={{padding:'6px 12px', fontSize:'13px'}}
                      onClick={() => setInboxMemoCat(activeEditingMemo.id, c)}
                    >
                      {c}
                    </button>
                  ))}
                </div>
                <button
                  class="stamp-btn secondary"
                  style={{minHeight:'38px', padding:'0 14px', fontSize:'14px', borderRadius:'8px'}}
                  onClick={() => setEditingMemoId(null)}
                >
                  完了
                </button>
              </div>

              <div class="modal-body">
                <textarea
                  class="modal-textarea"
                  placeholder="メモを入力..."
                  value={activeEditingMemo.text}
                  onChange={e => updateInboxMemoText(activeEditingMemo.id, e.target.value)}
                  autoFocus
                />
              </div>

              <div class="modal-footer">
                <span style={{fontSize:'13px', color:'var(--muted)'}}>{activeEditingMemo.date} {activeEditingMemo.time}</span>
                <div style={{display:'flex', gap:'8px'}}>
                  <button
                    class="stamp-btn secondary"
                    style={{minHeight:'38px', fontSize:'13px', padding:'0 14px'}}
                    onClick={() => { navigator.clipboard.writeText(activeEditingMemo.text); alert('コピーしました！'); }}
                  >
                    コピー
                  </button>
                  <button
                    class="stamp-btn"
                    style={{minHeight:'38px', fontSize:'13px', background:'rgba(255,50,50,0.2)', color:'#ff5555', padding:'0 14px'}}
                    onClick={() => deleteInboxMemo(activeEditingMemo.id)}
                  >
                    削除
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── TAB 3: CALENDAR ── */}
        <div class={`view-container ${activeTab === 'calendar' ? 'active' : ''}`}>
          <div class="cal-header-container">
            <div class="cal-title-nav">
              <button class="cal-nav-btn" onClick={() => handleCalendarMonthChange(-1)}>◀</button>
              <span class="cal-title-text">{calYear}年 {calMonth}月</span>
              <button class="cal-nav-btn" onClick={() => handleCalendarMonthChange(1)}>▶</button>
            </div>
            <div class="cal-monthly-total">{currentCalendarMonthTotal.toLocaleString()} 円</div>
          </div>

          <div class="card" style={{padding:'6px', marginBottom: '24px'}}>
            <div class="cal-grid">
              {['月','火','水','木','金','土','日'].map(w => <div key={w} class="cal-head-cell">{w}</div>)}
              {calendarDays.map((c, idx) => c.empty ? <div key={idx} class="cal-day-cell empty" /> : (
                <div key={idx} class={`cal-day-cell ${date === c.dateKey ? 'selected' : ''}`} onClick={() => { setDate(c.dateKey); setPeriod('day'); setActiveTab('dashboard'); }}>
                  <div class="cal-day-top">
                    <span class="cal-day-num current-month">{c.dayNum}</span>
                    {c.cond && <span class="cal-day-cond">{COND_ICONS.find(icon => icon.val === c.cond)?.label.split(' ')[0]}</span>}
                  </div>
                  <div class="cal-day-amt-box">
                    <span class="cal-day-amt">{formatSmartAmt(c.amt)}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div class={`view-container ${activeTab === 'expenses' ? 'active' : ''}`}>
          <ExpenseView expenses={expenses} onSave={saveExpenses} loadError={expenseState.error} />
        </div>

        {/* ── TAB 4: SETTINGS ── */}
        <div class={`view-container ${activeTab === 'settings' ? 'active' : ''}`}>
          <div class="section-title">☁️ iCloud Drive バックアップ / 同期</div>
          <div class="card" style={{borderColor:'var(--blue)', background:'rgba(41,121,255,0.03)'}}>
            <p style={{fontSize:'14px', color:'var(--muted2)', marginBottom:'14px'}}>
              稼働ログ、メモ、週・月・年のシミュレーション、クエスト、経費を含む全データをJSONファイルで保存・復元します。写真は含みません。
            </p>
            <div class="grid-2">
              <button class="gen-btn" style={{background:'var(--blue)'}} onClick={saveToiCloudJSON}>💾 iCloudへ完全保存</button>
              <button class="gen-btn" style={{background:'rgba(255,255,255,0.1)', color:'#fff', border:'1.5px solid var(--border)'}} onClick={() => document.getElementById('settingsCloudLoad').click()}>📥 iCloudから同期</button>
            </div>
            <input type="file" id="settingsCloudLoad" accept=".json" style={{display:'none'}} onChange={loadFromiCloudJSON} />
          </div>
          <div class="section-title">データコントロール</div>
          <div class="card">
            <button class="gen-btn" style={{background:'rgba(255,92,26,0.2)', color:'var(--accent)', border:'1.5px solid var(--accent)'}} onClick={startNewDay}>新しい営業日を開始する (4時起点)</button>
          </div>
        </div>

        {/* BOTTOM NAV TABS */}
        <nav class="bottom-nav">
          <button class={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
            <span aria-hidden="true" className="sim-nav-icon">🛵</span><span>稼働</span>
          </button>
          <button className={`tab-btn ${activeTab === 'simulation' ? 'active' : ''}`} aria-current={activeTab==='simulation'?'page':undefined} onClick={() => setActiveTab('simulation')}><span aria-hidden="true" className="sim-nav-icon">🧮</span><span>売上管理</span></button>
          <button class={`tab-btn ${activeTab === 'memos' ? 'active' : ''}`} onClick={() => setActiveTab('memos')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span>メモ</span>
          </button>
          <button class={`tab-btn ${activeTab === 'expenses' ? 'active' : ''}`} onClick={() => setActiveTab('expenses')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 7h8M8 11h8M8 15h4"/></svg><span>経費</span>
          </button>
          <button class={`tab-btn ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="18" y2="10"/></svg><span>カレンダー</span>
          </button>
          <button class={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>設定</span>
          </button>
        </nav>
      </div>
    </div>
  );
}

const EMPTY_SET = () => ({
  start: '', end: '', d_cum: '', u_cum: '', r_cum: '', m_cum: '', d_cnt_cum: '', u_cnt_cum: '', r_cnt_cum: '', m_cnt_cum: '', d_que_cum: '', u_que_cum: '', r_que_cum: '', m_que_cum: '', km_cum: '', memo: '', open: true,
});

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
