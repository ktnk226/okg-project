<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>::: デリログ :::</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #10151c; --surface: #19212b; --surface2: #222d39;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      --text: #f0f0f0; --muted: #a7b4c5; --muted2: #c1cbd8;
      --accent: #8db6db; --accent2: #8db6db; --green: #85c7ae; --yellow: #d9c18d;
      --blue: #94b9e8; --teal: #8ac8cd;
      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'Noto Sans JP', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --radius: 14px; --radius-sm: 9px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; font-size: 16px; }
    
    #expense-form { scroll-margin-top: 100px; }

    /* Keep Safari's native date field inside its expense-form grid cell. */
    #expense-form .expense-date-amount {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
    }
    #expense-form .expense-date-amount > label { min-width: 0; }
    #expense-form .expense-date-amount input {
      display: block; width: 100%; min-width: 0; max-width: 100%;
      min-height: 50px; -webkit-appearance: none; appearance: none;
    }
    #expense-form input[type="date"]::-webkit-date-and-time-value {
      min-width: 0; text-align: left;
    }
    @media (max-width: 480px) {
      #expense-form .expense-date-amount { grid-template-columns: minmax(0, 1fr); }
    }

    #expense-form fieldset:disabled { opacity: .65; }
    button:disabled { cursor: wait; opacity: .6; }

    /* APP LAYOUT */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 110px; }
    
    /* SIDEBAR (PC用) */
    .sidebar {
      width: 260px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 20px; gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .brand-mark { font-size: 28px; }
    .brand-title { font-family: var(--font-head); font-size: 26px; letter-spacing: 0.05em; color: #fff; line-height: 1.1; }
    
    .nav-menu { display: flex; flex-direction: column; gap: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      background: transparent; border: none; border-radius: var(--radius-sm);
      color: var(--muted2); font-size: 16px; font-weight: 700; text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .nav-item.active { background: var(--accent); color: #fff; font-weight: 900; }

    /* HEADER TOPBAR */
    .topbar {
      background: rgba(8,9,13,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .topbar h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
    .topbar p { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* PERIOD SWITCHER TABS */
    .period-switcher-container { padding: 16px 20px 0; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
    .period-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); padding: 5px; border-radius: var(--radius-sm); width: 100%; max-width: 440px; margin: 0 auto; }
    .period-tab { flex: 1; background: transparent; border: none; color: var(--muted2); padding: 11px 0; font-size: 17px; font-weight: 800; cursor: pointer; border-radius: 6px; transition: all 0.2s; text-align: center; }
    .period-tab.active { background: var(--surface2); color: var(--accent); border: 1px solid rgba(255,92,26,0.3); font-weight: 900; }

    /* ◀ PERIOD NAV BAR ▶ */
    .period-nav-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin: 0 auto; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 16px; }
    .period-nav-btn { background: transparent; border: none; color: var(--accent); font-size: 20px; font-weight: 900; cursor: pointer; padding: 4px 14px; user-select: none; }
    .period-nav-btn:hover { color: #fff; }
    .period-nav-display { font-size: 16px; font-weight: 800; font-family: var(--font-mono); color: #fff; text-align: center; }

    /* SUMMARY BAR */
    .summary-bar {
      background: var(--surface); border-bottom: 1.5px solid var(--border);
      padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .sum-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sum-row.col-3 { grid-template-columns: 1fr 1fr 1fr; }
    .sum-item { padding: 0; min-width: 0; }
    .sum-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; font-weight: 700; }
    .sum-val { font-size: 21px; font-family: var(--font-mono); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum-val.accent { color: var(--accent); font-size: 23px; }
    .sum-val.green { color: var(--green); }
    .sum-val.yellow { color: var(--yellow); }
    .sum-val.teal { color: var(--teal); }
    .sum-row + .sum-row { border-top: 1px solid var(--border); padding-top: 10px; }

    /* SPLIT WEEK SUMMARY */
    .week-split-container {
      background: var(--surface2);
      border-bottom: 1.5px solid var(--border);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .split-card {
      background: rgba(255,255,255,0.03);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .split-title { font-size: 14px; font-weight: 800; letter-spacing: 0.03em; }
    .split-title.weekday { color: var(--teal); }
    .split-title.weekend { color: var(--accent); }
    .split-main-amt { font-size: 22px; font-weight: 800; font-family: var(--font-mono); color: #fff; }
    .split-sub-row { font-size: 13px; font-family: var(--font-mono); color: var(--muted2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .split-sub-metrics { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; font-family: var(--font-mono); color: var(--muted2); margin-top: 4px; }
    .split-sub-metrics span, .split-sub-row span { white-space: nowrap; }

    /* GOAL PANEL */
    .goal-panel { background: var(--surface); border-bottom: 1.5px solid var(--border); padding: 18px 22px; }
    .goal-inputs-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
    .goal-input-row { display: flex; justify-content: space-between; align-items: center; }
    .goal-title-flex { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted2); font-weight: 800; }
    .goal-input-wrapper { display: flex; align-items: center; gap: 6px; }
    .goal-input { font-family: var(--font-mono); font-size: 18px; font-weight: 800; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; width: 130px; text-align: right; }
    
    .progress-section { margin-top: 10px; }
    .progress-track { width: 100%; height: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; overflow: hidden; margin-bottom: 6px; border: 1px solid var(--border); }
    .progress-bar { height: 100%; background: var(--accent); transition: width 0.3s ease; }
    .progress-bar.green { background: var(--green); }
    
    .goal-footer-row { display: flex; justify-content: space-between; font-size: 14px; font-family: var(--font-mono); flex-direction: column; gap: 4px; }
    .goal-footer-top { display: flex; justify-content: space-between; width: 100%; align-items: center; }
    .goal-footer-sub { display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: 12px; font-family: var(--font-mono); margin-top: 2px; }
    .goal-status-text { color: var(--muted); }
    .goal-status-text strong { color: #fff; }
    .goal-remain-text { font-weight: 800; }
    .goal-remain-text.done { color: var(--green); }
    .goal-remain-text.remain { color: var(--accent); }

    /* VIEW MANAGEMENT */
    .view-container { padding: 22px; max-width: 760px; width: 100%; margin: 0 auto; display: none; }
    .view-container.active { display: block; }
    .section-title { font-size: 15px; font-weight: 800; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; margin-top: 20px; }

    /* CARDS & FORMS */
    .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 14px; color: var(--muted2); display: block; margin-bottom: 6px; font-weight: 700; }
    input, select, textarea {
      width: 100%; padding: 13px 15px; background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border2); border-radius: var(--radius-sm); color: #fff; font-size: 16px; font-family: var(--font-body);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.08); }

    .condition-row { display: flex; gap: 8px; margin-top: 4px; }
    .cond-btn {
      flex: 1; padding: 12px 6px; background: rgba(255,255,255,0.04); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--muted2); font-size: 17px; font-weight: 800; cursor: pointer; text-align: center;
    }
    .cond-btn.active { border-color: var(--yellow); background: rgba(255,214,0,0.12); color: #fff; font-weight: 900; }

    .daily-memo-textarea {
      width: 100%; min-height: 120px; background: rgba(0,0,0,0.3); border: 1.5px solid var(--border2);
      border-radius: var(--radius-sm); color: #fff; font-size: 16px; line-height: 1.6; padding: 14px;
      font-family: var(--font-body); resize: vertical;
    }

    /* SET CARD */
    .set-card { background: rgba(255,255,255,0.02); border: 1.5px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
    .set-header { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; user-select: none; }
    .set-header:hover { background: rgba(255,255,255,0.03); }
    .set-header-top { display: flex; align-items: center; justify-content: space-between; }
    .set-title { font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .set-badge { font-size: 12px; padding: 4px 9px; border-radius: 4px; font-weight: 800; }
    .set-badge.active { background: rgba(255,92,26,0.2); color: var(--accent); }
    .set-badge.done { background: rgba(0,230,118,0.15); color: var(--green); }
    
    .set-summary-row1 { font-size: 20px; font-weight: 800; color: #fff; font-family: var(--font-mono); }
    .set-summary-row2 { font-size: 14px; color: var(--muted2); font-family: var(--font-mono); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .set-summary-tag { background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }
    .set-summary-rates { display: flex; gap: 10px; }

    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; margin-bottom: 12px; }
    .time-field { display: flex; gap: 6px; }
    .stamp-btn { padding: 0 16px; background: var(--accent); color: #fff; border-radius: 6px; font-size: 14px; font-weight: 900; border: none; cursor: pointer; min-height: 48px; }
    .stamp-btn.secondary { background: rgba(255,255,255,0.15); }
    .time-duration { font-size: 14px; color: var(--teal); font-family: var(--font-mono); margin-top: 4px; font-weight: 800; }

    .platform-block { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; }
    .platform-title { font-weight: 800; font-size: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .diff-badge { font-size: 14px; font-family: var(--font-mono); opacity: 0.9; }
    .pf-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .del-btn { width: 100%; padding: 14px; background: rgba(255,50,50,0.15); color: #ff5555; border: 1px solid rgba(255,50,50,0.3); border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 12px; font-size: 15px; }
    .add-btn { width: 100%; padding: 18px; background: rgba(255,255,255,0.05); color: #fff; border: 1.5px dashed var(--border2); border-radius: var(--radius); font-weight: 800; cursor: pointer; font-size: 17px; }

    .log-box { background: #000; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 14px; padding: 18px; font-family: var(--font-mono); font-size: 14px; white-space: pre-wrap; line-height: 1.7; color: #ccc; }
    .copy-btn { width: 100%; margin-top: 10px; padding: 16px; background: var(--green); color: #000; font-weight: 900; border-radius: 8px; border: none; cursor: pointer; font-size: 17px; }

    /* CALENDAR */
    .cal-header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cal-title-nav { display: flex; align-items: center; gap: 14px; }
    .cal-nav-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 16px; }
    .cal-nav-btn:hover { background: rgba(255,255,255,0.15); }
    .cal-title-text { font-size: 22px; font-weight: 900; }
    .cal-monthly-total { font-family: var(--font-mono); font-size: 19px; font-weight: 800; color: var(--accent); background: rgba(255,92,26,0.1); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,92,26,0.25); }

    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 12px; width: 100%; }
    .cal-head-cell { text-align: center; font-size: 14px; color: var(--muted); font-weight: 800; padding: 6px 0; }
    
    .cal-day-cell {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px;
      min-height: 96px; padding: 6px 4px; cursor: pointer; display: flex; flex-direction: column;
      justify-content: space-between; min-width: 0; position: relative; overflow: hidden;
    }
    .cal-day-cell:hover { background: var(--surface2); border-color: var(--muted2); }
    .cal-day-cell.empty { background: transparent; border: none; cursor: default; }
    .cal-day-cell.selected { border-color: var(--accent); background: rgba(255,92,26,0.08); }
    
    .cal-day-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .cal-day-num { font-size: 15px; font-weight: 800; font-family: var(--font-mono); color: var(--muted2); }
    .cal-day-num.current-month { color: #fff; }
    .cal-day-cond { font-size: 12px; line-height: 1; }
    
    .cal-day-amt-box { text-align: right; width: 100%; margin-top: auto; }
    .cal-day-amt {
      font-size: 13px; font-family: var(--font-mono); font-weight: 800; color: var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }

    /* 📝 MEMO / INBOX (Keep風ポップアップ編集 & 視認性UP) */
    .memo-cat-filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .memo-cat-btn {
      padding: 9px 16px; background: rgba(255,255,255,0.05); border: 1.5px solid var(--border);
      border-radius: 22px; color: var(--muted2); font-size: 15px; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .memo-cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 900; }
    
    .memo-item-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 18px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px;
      cursor: pointer; transition: all 0.2s;
    }
    .memo-item-card:hover { background: var(--surface2); border-color: var(--muted2); }
    .memo-item-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
    
    .memo-preview-text {
      font-size: 17px; line-height: 1.6; color: #fff; white-space: pre-wrap;
      word-break: break-word; max-height: 160px; overflow: hidden; position: relative;
    }
    .memo-tag-pill {
      font-size: 13px; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.08);
      color: var(--teal); font-weight: 800; border: 1px solid var(--border);
    }

    /* 🪟 Google Keep風 全面ポップアップ編集モーダル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px);
      z-index: 9999; display: flex; justify-content: center; align-items: center;
      padding: 16px; animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .memo-modal-card {
      background: var(--surface); border: 1.5px solid var(--border2); border-radius: 18px;
      width: 100%; max-width: 680px; height: 86vh; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1.5px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .modal-body {
      flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto;
    }
    .modal-textarea {
      flex: 1; width: 100%; height: 100%; background: transparent; border: none;
      color: #fff; font-size: 18px; line-height: 1.7; font-family: var(--font-body);
      resize: none; outline: none; padding: 0;
    }
    .modal-footer {
      padding: 14px 20px; border-top: 1.5px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25);
    }

    /* BOTTOM NAV TABS */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 76px; background: rgba(15,17,23,0.95); backdrop-filter: blur(20px); border-top: 1.5px solid var(--border); display: none; justify-content: space-around; align-items: center; z-index: 500; }
    .tab-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--muted); gap: 4px; font-size: 13px; font-weight: 700; cursor: pointer; width: 75px; }
    .tab-btn.active { color: var(--accent); font-weight: 900; }
    .nav-icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: color 0.2s; }
    .tab-btn.active .nav-icon { stroke: var(--accent); }

    .cloud-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; padding: 6px 14px; border-radius: 20px; background: rgba(41,121,255,0.1); color: var(--blue); }
    .cloud-indicator.unsaved { background: rgba(255,214,0,0.1); color: var(--yellow); }
    .gen-btn { width: 100%; padding: 18px; background: var(--accent); border-radius: var(--radius); color: #fff; font-size: 19px; font-weight: 900; border: none; cursor: pointer; }

    /* 📱 スマホ最適化 */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .bottom-nav { display: flex; }
      .topbar { padding: 14px 16px; }
      .view-container { padding: 16px; }
      .summary-bar { padding: 14px 16px; gap: 10px; }
      .week-split-container { padding: 12px 16px; gap: 10px; }
      .goal-panel { padding: 14px 16px; }
      .grid-3 { grid-template-columns: 1fr; gap: 12px; }
      
      .cal-day-cell { min-height: 82px; padding: 4px 2px; }
      .cal-day-num { font-size: 13px; }
      .cal-day-amt { font-size: 12px; font-weight: 800; } 
      
      .sum-val { font-size: 19px; }
      .sum-val.accent { font-size: 22px; }
      .split-main-amt { font-size: 19px; }

      .memo-modal-card { height: 92vh; border-radius: 14px; }
      .modal-textarea { font-size: 17px; }
    }

    /* iPhone-first readability and tap-target redesign (2026-10) */
    @media (max-width: 768px) {
      html, body { font-size: 17px; }
      .main-content { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
      .topbar { padding: 16px 18px; }
      .topbar h1 { font-size: 25px; }
      .topbar p, .sum-label, .split-sub-row, .split-sub-metrics, .goal-footer-row,
      .set-summary-row2, .memo-item-header, .cloud-indicator { font-size: 15px; }
      .period-switcher-container { padding: 14px 16px 0; }
      .period-tab { min-height: 48px; font-size: 18px; }
      .period-nav-btn { min-width: 52px; min-height: 48px; }

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

const SK = {
  db: 'delivery_log_vault_v13',
  currentDate: 'delivery_log_current_date_v13',
  goals: 'delivery_log_periodic_goals_v13',
  memos: 'delivery_log_inbox_memos_v13',
  expenses: 'delivery_log_expenses_v1'
};

const PLATFORMS = [
  { key: 'd', label: '出前館', color: '#ff2a2a' },
  { key: 'u', label: 'Uber Eats',   color: '#06C167' },
  { key: 'r', label: 'RocketNow', color: '#2979ff' },
  { key: 'm', label: 'menu',   color: '#e91e8c' },
];

const WEATHERS = ['晴','曇','雨','雪','晴→雨','雨→晴','曇→雨'];
const COND_ICONS = [
  { val: 1, label: '😫 1' },
  { val: 2, label: '😕 2' },
  { val: 3, label: '😐 3' },
  { val: 4, label: '🙂 4' },
  { val: 5, label: '🔥 5' },
];

const MEMO_CATEGORIES = ['🛵稼働', '💡アイデア', '📌タスク', '📓日記'];

function getNow() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getBusinessDateStr() {
  return new Date(Date.now()+5*60*60*1000).toISOString().slice(0,10);
}

function formatDateToParam(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatSmartAmt(amt) {
  if (!amt || amt === 0) return '';
  if (amt >= 10000) {
    const man = (amt / 10000).toFixed(1);
    return `${man.endsWith('.0') ? Math.floor(amt/10000) : man}万`;
  }
  return `¥${amt.toLocaleString()}`;
}

function calcDuration(start, end) {
  if (!start || !end) return null;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diffMin = (eh * 60 + em) - (sh * 60 + sm);
  if (diffMin < 0) diffMin += 24 * 60;
  return { total: diffMin / 60, h: Math.floor(diffMin / 60), m: diffMin % 60 };
}

function loadInitialVault() {
  const saved = localStorage.getItem(SK.db);
  return saved ? JSON.parse(saved) : {};
}

function loadInitialDate() {
  const saved = localStorage.getItem(SK.currentDate);
  return saved || getBusinessDateStr();
}

function loadInitialGoals() {
  const saved = localStorage.getItem(SK.goals);
  return saved ? JSON.parse(saved) : {}; 
}

function loadInitialMemos() {
  const saved = localStorage.getItem(SK.memos);
  return saved ? JSON.parse(saved) : [];
}

function getYearWeekStr(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  const mondayOffset = day === 0 ? -6 : 1 - day;
  const mon = new Date(d.getTime() + mondayOffset * 86400000);
  const year = mon.getFullYear();
  const startOfYear = new Date(year, 0, 1);
  const weekNum = Math.ceil((((mon - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
  return `${year}-W${String(weekNum).padStart(2,'0')}`;
}

const EXPENSE_CATEGORIES = ['燃料費', '車両整備・修理', '消耗品', '通信費', '保険料', '駐車・通行料', 'その他'];
function expenseToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function validExpenseDate(value) {
  return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && !isNaN(Date.parse(value)) && new Date(value).toISOString().slice(0,10) === value;
}
function cleanExpenses(items) {
  if (!Array.isArray(items)) throw new Error('経費形式');
  const ids = new Set();
  return items.map(e => {
    if (!e || typeof e.id !== 'string' || !e.id || ids.has(e.id) || !validExpenseDate(e.date) || !Number.isSafeInteger(e.amount) || e.amount <= 0 || e.amount > 999999999 || !EXPENSE_CATEGORIES.includes(e.category) || typeof e.payee !== 'string' || typeof e.memo !== 'string') throw new Error('経費形式');
    ids.add(e.id);
    return {id:e.id, date:e.date, amount:e.amount, category:e.category, payee:e.payee, memo:e.memo};
  });
}
function parseExpenseReceipt(raw) {
  const text = raw.normalize('NFKC');
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const match = text.match(/(20\d{2})\s*[年\/.-]\s*(\d{1,2})\s*[月\/.-]\s*(\d{1,2})/);
  const date = match ? `${match[1]}-${match[2].padStart(2,'0')}-${match[3].padStart(2,'0')}` : '';
  const totals = lines.filter(s => /合\s*計|総\s*額|お\s*支\s*払\s*い?\s*金\s*額|TOTAL/i.test(s) && !/小\s*計|税|対象/.test(s));
  const values = totals.flatMap(s => {
    const tail = s.replace(/^.*?(?:合\s*計|総\s*額|お\s*支\s*払\s*い?\s*金\s*額|TOTAL)/i, '');
    const m = tail.match(/[¥￥]?\s*(\d[\d,]*)\s*円?/);
    return m ? [Number(m[1].replace(/,/g,''))] : [];
  }).filter(n => Number.isSafeInteger(n) && n > 0 && n <= 999999999);
  const unique = [...new Set(values)];
  return {date:validExpenseDate(date) ? date : '', amount:unique.length === 1 ? String(unique[0]) : ''};
}
let expenseOCRLoader;
function loadExpenseOCR() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (!expenseOCRLoader) expenseOCRLoader = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    const timer = setTimeout(() => {script.remove(); expenseOCRLoader = null; reject(new Error('読込タイムアウト'));}, 30000);
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';
    script.onload = () => {clearTimeout(timer); resolve(window.Tesseract);};
    script.onerror = () => {clearTimeout(timer); script.remove(); expenseOCRLoader = null; reject(new Error('読込失敗'));};
    document.head.appendChild(script);
  });
  return expenseOCRLoader;
}
async function expenseImageCanvas(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((resolve,reject) => {img.onload=resolve; img.onerror=reject; img.src=url;});
    const scale = Math.min(1, 2200 / Math.max(img.naturalWidth,img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(img.naturalWidth*scale)); canvas.height = Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx = canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height);
    return canvas;
  } finally {URL.revokeObjectURL(url);}
}

const EXPENSE_AI_ENDPOINT = 'https://okg-project.ktnk226.workers.dev/analyze-expense';
async function analyzeExpenseImage(file, token) {
  let canvas;
  try {
    canvas = await expenseImageCanvas(file);
    const image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    if (image.length > 4 * Math.ceil(5 * 1024 * 1024 / 3)) throw new Error('画像が大きすぎます。小さい写真で再試行してください。');
    const response = await fetch(EXPENSE_AI_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json',Authorization:`Bearer ${token.trim()}`},
      body:JSON.stringify({mimeType:'image/jpeg',data:image}),
      signal:AbortSignal.timeout(35000), credentials:'omit', redirect:'error'
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'AI解析に失敗しました。');
    if (!validExpenseDate(result.date) || !Number.isSafeInteger(result.amount) || result.amount <= 0 || result.amount > 999999999 ||
        !EXPENSE_CATEGORIES.includes(result.category) || typeof result.store !== 'string' || !result.store.trim() || result.store.length > 200)
      throw new Error('解析結果を確認できません。手動入力してください。');
    return {date:result.date,amount:String(result.amount),category:result.category,payee:result.store};
  } finally { if(canvas) {canvas.width=0;canvas.height=0;} }
}

function buildExpenseFreeeCSV(rows, settings, account) {
  const quote = value => '"' + String(value ?? '').replace(/"/g, '""') + '"';
  const header = ['収支区分','管理番号','発生日','決済期日','取引先コード','取引先','勘定科目','税区分','金額','税計算区分','税額','備考','品目','部門','メモタグ','決済日','決済口座','決済金額'];
  const records = cleanExpenses(rows).sort((a,b)=>a.date.localeCompare(b.date)).map(e => {
    const config = settings[e.id];
    if (!config?.subject?.trim() || !config?.tax?.trim()) throw new Error('各経費の勘定科目と税区分を入力してください。');
    const date = e.date.replace(/-/g,'/');
    return ['支出',e.id,date,'','',e.payee,config.subject.trim(),config.tax.trim(),e.amount,'税込','',e.memo,'','','',account.trim() ? date : '',account.trim(),account.trim() ? e.amount : ''];
  });
  return '\uFEFF' + [header,...records].map(row=>row.map(quote).join(',')).join('\r\n') + '\r\n';
}

function ExpenseView({expenses, onSave, loadError}) {
  const empty = () => ({id:'',date:expenseToday(),amount:'',category:'その他',payee:'',memo:''});
  const [form,setForm] = useState(empty);
  const [exportOpen,setExportOpen] = useState(false);
  const [exportSettings,setExportSettings] = useState({});
  const [exportAccount,setExportAccount] = useState('');
  const [exportError,setExportError] = useState('');
  const [mode,setMode] = useState('month');
  const [month,setMonth] = useState(() => expenseToday().slice(0,7));
  const [year,setYear] = useState(() => expenseToday().slice(0,4));
  const [category,setCategory] = useState('すべて');
  const [busy,setBusy] = useState(false);
  const [status,setStatus] = useState('');
  const [raw,setRaw] = useState('');
  const [scanMode,setScanMode] = useState('local');
  const [aiToken,setAiToken] = useState('');
  const lock = React.useRef(false);
  const field = (key,value) => setForm(prev => ({...prev,[key]:value}));
  const rows = expenses.filter(e => (mode === 'all' || e.date.startsWith(mode === 'month' ? month : year)) && (category === 'すべて' || e.category === category)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = rows.reduce((sum,e)=>sum+e.amount,0);
  const openExport = () => {
    const subjects = {'燃料費':'車両費','車両整備・修理':'修繕費','消耗品':'消耗品費','通信費':'通信費','保険料':'保険料','駐車・通行料':'旅費交通費','その他':'雑費'};
    setExportSettings(prev=>Object.fromEntries(rows.map(e=>[e.id,prev[e.id] || {subject:subjects[e.category],tax:''}])));
    setExportError(''); setExportOpen(true);
  };
  const exportCSV = () => {
    try {
      if (!rows.length) throw new Error('出力対象の経費がありません。');
      const csv = buildExpenseFreeeCSV(rows,exportSettings,exportAccount);
      const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
      if (blob.size > 5000000) throw new Error('5MBを超えるため、集計期間を短くして出力してください。');
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href=url; link.download='freee_expenses_'+(mode==='all' ? 'all' : mode==='month' ? month : year)+'.csv';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      setExportError('CSVを出力しました。経費の記録はそのまま残っています。');
    } catch (error) {setExportError(error.message);}
  };
  const reset = () => {setForm(empty()); setRaw(''); setStatus('');};
  const save = event => {
    event.preventDefault();
    if (busy || loadError) return;
    const item = {...form, id:form.id || (window.crypto?.randomUUID ? window.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`), amount:Number(form.amount)};
    try {cleanExpenses([item]);} catch {setStatus('日付と1〜999,999,999円の整数金額を確認してください。'); return;}
    if (form.id && !expenses.some(e=>e.id===form.id)) {setStatus('編集中の記録が見つかりません。「入力をクリア」して再入力してください。'); return;}
    const next = form.id ? expenses.map(e=>e.id===form.id ? item : e) : [...expenses,item];
    if (onSave(next)) {reset(); setMonth(item.date.slice(0,7)); setYear(item.date.slice(0,4)); setCategory('すべて'); setStatus('経費を保存しました。');}
  };
  const scan = async event => {
    const file = event.target.files?.[0]; event.target.value='';
    if (!file || lock.current) return;
    if (scanMode === 'ai' && !aiToken.trim()) {setStatus('AI解析の利用パスワードを入力してください。');return;}
    if (file.size > 25*1024*1024) {setStatus('写真は25MB以下を選んでください。');return;}
    lock.current=true; setBusy(true); setRaw(''); setStatus('読み取りを準備しています…');
    let worker, canvas, timer, finished = false;
    try {
      if (scanMode === 'ai') {
        setStatus('AIが解析しています…');
        // Replace receipt fields together; an earlier receipt must not survive a failed scan.
        setForm(prev=>({...prev,date:'',amount:'',payee:'',category:'その他'}));
        const result = await analyzeExpenseImage(file, aiToken);
        setForm(prev=>({...prev,...result}));
        setStatus('AI解析が完了しました。日付・金額・支払先・分類を確認して保存してください。');
        return;
      }
      const task = async () => {
        const engine = await loadExpenseOCR();
        if (finished) return;
        canvas = await expenseImageCanvas(file);
        if (finished) {canvas.width=0;canvas.height=0;return;}
        worker = await engine.createWorker('jpn+eng', 1, {
          workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js',
          corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0',
          logger:m=>{if(!finished) setStatus(m.status==='recognizing text' ? `読み取り中… ${Math.round(m.progress*100)}%` : '読み取り用データを準備しています…');}
        });
        if (finished) {await worker.terminate();return;}
        return worker.recognize(canvas);
      };
      const result = await Promise.race([task(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('timeout')),120000);})]);
      const text = result?.data?.text || '';
      setRaw(text);
      const parsed = parseExpenseReceipt(text);
      // Never retain a previous receipt's date/amount when recognition misses them.
      setForm(prev=>({...prev,date:parsed.date,amount:parsed.amount}));
      setStatus(text.trim() ? '読み取りました。日付・合計金額を確認し、支払先・分類などを入力して保存してください。空欄は手入力してください。' : '文字を読み取れませんでした。撮り直すか手入力してください。');
    } catch (error) {setStatus(scanMode === 'ai' ? `${error.name === 'TimeoutError' ? 'AI解析がタイムアウトしました。' : error.message} 端末内の読み取りや手動入力も利用できます。` : '写真を読み取れませんでした。通信や画像形式を確認して再試行するか、手入力してください。');}
    finally {finished=true; clearTimeout(timer); lock.current=false; if(worker) await worker.terminate().catch(()=>{}); if(canvas){canvas.width=0;canvas.height=0;} setBusy(false);}
  };
  return <>
    <h2 class="section-title">🧾 経費の記録・集計</h2>
    {loadError && <p role="alert">{loadError}</p>}
    <form class="card" onSubmit={save} id="expense-form">
      <h3 style={{marginBottom:16}}>{form.id ? '経費を編集' : '経費を追加'}</h3>
      <fieldset disabled={busy || !!loadError} style={{border:0,minWidth:0}}>
        <label>写真の読み取り方法<select aria-label="写真の読み取り方法" value={scanMode} onChange={e=>setScanMode(e.target.value)}>
          <option value="local">端末内で読み取る</option><option value="ai">AIで解析する</option>
        </select></label>
        {scanMode === 'ai' && <label>AI解析の利用パスワード<input aria-label="AI解析の利用パスワード" type="password" autoComplete="off" value={aiToken} onChange={e=>setAiToken(e.target.value)} /></label>}
        <div class="grid-2" style={{marginBottom:12}}>
          <label class="add-btn" style={{textAlign:'center',fontSize:16}}>📷 撮影する<input aria-label="レシートを撮影" type="file" accept="image/*" capture="environment" onChange={scan} style={{display:'none'}} /></label>
          <label class="add-btn" style={{textAlign:'center',fontSize:16}}>写真を選ぶ<input aria-label="レシート写真を選択" type="file" accept="image/*" onChange={scan} style={{display:'none'}} /></label>
        </div>
        <p style={{color:'var(--muted2)',fontSize:14,marginBottom:16}}>{scanMode === 'ai' ? '選択した写真をCloudflare経由でGoogleへ送信して解析します。利用パスワードはこの画面を閉じると消えます。GoogleのAPIキーは入力しないでください。' : '写真は端末内で読み取り、保存・送信しません。初回は読み取り用データの取得に時間がかかります。'}</p>
        <div class="expense-date-amount" style={{marginBottom:12}}>
          <label>日付<input aria-label="経費の日付" type="date" required value={form.date} onChange={e=>field('date',e.target.value)} /></label>
          <label>金額（円）<input aria-label="経費の金額" type="number" inputMode="numeric" min="1" max="999999999" step="1" required value={form.amount} onChange={e=>field('amount',e.target.value)} /></label>
        </div>
        <label>分類<select aria-label="経費の分類" value={form.category} onChange={e=>field('category',e.target.value)}>{EXPENSE_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></label>
        <label>支払先<input aria-label="経費の支払先" maxLength="200" placeholder="店舗名など" value={form.payee} onChange={e=>field('payee',e.target.value)} /></label>
        <label>メモ<textarea aria-label="経費のメモ" maxLength="2000" rows="2" value={form.memo} onChange={e=>field('memo',e.target.value)} /></label>
        <button class="gen-btn" type="submit" style={{marginTop:12}}>{form.id ? '変更を保存' : '経費を保存'}</button>
        <button class="add-btn" type="button" style={{marginTop:8,padding:12}} onClick={reset}>{form.id ? '編集をキャンセル' : '入力をクリア'}</button>
      </fieldset>
      <p role="status" style={{lineHeight:1.7,marginTop:12}}>{status}</p>
      {raw && <details style={{marginTop:12}}><summary>読み取った文字を確認</summary><pre style={{whiteSpace:'pre-wrap',overflowWrap:'anywhere',fontSize:14,marginTop:12}}>{raw}</pre></details>}
    </form>
    <div class="card">
      <h3 style={{marginBottom:12}}>経費の集計</h3>
      <div class="grid-2">
        <label>集計期間<select aria-label="経費の集計期間" value={mode} onChange={e=>setMode(e.target.value)}><option value="month">月別</option><option value="year">年別</option><option value="all">全期間</option></select></label>
        {mode==='month' && <label>対象月<input aria-label="経費の対象月" type="month" value={month} onChange={e=>setMonth(e.target.value)} /></label>}
        {mode==='year' && <label>対象年<input aria-label="経費の対象年" type="number" min="2000" max="9999" value={year} onChange={e=>setYear(e.target.value)} /></label>}
      </div>
      <label>分類で絞り込み<select aria-label="経費の絞り込み" value={category} onChange={e=>setCategory(e.target.value)}>{['すべて',...EXPENSE_CATEGORIES].map(c=><option key={c}>{c}</option>)}</select></label>
      <p style={{fontSize:28,color:'var(--accent)',fontWeight:900,margin:'16px 0'}} data-testid="expense-total">{total.toLocaleString()} 円 <small style={{fontSize:16}}>／ {rows.length}件</small></p>
      {EXPENSE_CATEGORIES.map(c=>{const list=rows.filter(e=>e.category===c);return list.length>0 && <div key={c} style={{display:'flex',justifyContent:'space-between',gap:12,padding:'8px 0',borderTop:'1px solid var(--border)'}}><span>{c}</span><strong>{list.reduce((s,e)=>s+e.amount,0).toLocaleString()} 円</strong></div>;})}
    </div>
    <div class="card">
      <button class="gen-btn" disabled={!rows.length || !!loadError} onClick={openExport}>freee用CSVをエクスポート（{rows.length}件）</button>
      <p style={{fontSize:14,lineHeight:1.7,marginTop:10}}>現在の集計期間・分類で絞り込んだ経費を出力します。</p>
      {exportOpen && <div style={{marginTop:16}}>
        <p style={{fontSize:14,lineHeight:1.7}}>勘定科目は分類からの候補です。各明細の科目・税区分をfreeeの設定に合わせて確認してください。金額は税込として出力します。</p>
        <label style={{marginTop:12}}>決済口座（任意）
          <input aria-label="CSV決済口座" placeholder="空欄：未決済／入力例：現金" value={exportAccount} onChange={e=>setExportAccount(e.target.value)} />
        </label>
        <p style={{fontSize:14,lineHeight:1.7}}>空欄なら未決済として出力します。口座を入力すると全件を記録日付で決済済みとして出力します。支払方法が異なる場合は空欄で出力し、freeeで決済を登録してください。</p>
        {rows.map(e=><div key={e.id} style={{borderTop:'1px solid var(--border)',marginTop:16,paddingTop:12}}>
          <p style={{marginBottom:8,overflowWrap:'anywhere'}}>{e.date} ／ {e.payee || e.category} ／ {e.amount.toLocaleString()}円</p>
          <label>勘定科目<input aria-label={'CSV勘定科目 '+e.id} value={exportSettings[e.id]?.subject || ''} onChange={v=>setExportSettings(prev=>({...prev,[e.id]:{...prev[e.id],subject:v.target.value}}))}/></label>
          <label>税区分<input aria-label={'CSV税区分 '+e.id} placeholder="freee上の税区分名を入力" value={exportSettings[e.id]?.tax || ''} onChange={v=>setExportSettings(prev=>({...prev,[e.id]:{...prev[e.id],tax:v.target.value}}))}/></label>
        </div>)}
        <p style={{fontSize:14,lineHeight:1.7,margin:'12px 0'}}>同じ経費を再インポートすると重複登録されます。freeeの「取引データのインポート」で読み込んでください。</p>
        <button class="gen-btn" disabled={!rows.length || !!loadError} onClick={exportCSV}>確認してCSVをダウンロード</button>
        <p role="status" style={{marginTop:10}}>{exportError}</p>
        <button class="add-btn" style={{marginTop:10,padding:12}} onClick={()=>setExportOpen(false)}>出力設定を閉じる</button>
      </div>}
    </div>
    <h3 class="section-title">経費一覧</h3>
    {!rows.length && <p style={{padding:20,color:'var(--muted2)'}}>この期間・分類の経費はありません。</p>}
    {rows.map(e=><div class="card" key={e.id} style={{overflowWrap:'anywhere'}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:12}}><span>{e.date}<br/>{e.category}</span><strong style={{fontSize:22}}>{e.amount.toLocaleString()} 円</strong></div>
      {e.payee && <p style={{marginTop:10}}>{e.payee}</p>}{e.memo && <p style={{whiteSpace:'pre-wrap',marginTop:8,color:'var(--muted2)'}}>{e.memo}</p>}
      <div class="grid-2" style={{marginTop:12}}>
        <button class="stamp-btn secondary" disabled={busy} onClick={()=>{setForm({...e,amount:String(e.amount)});setRaw('');setStatus('');document.getElementById('expense-form').scrollIntoView({behavior:'smooth',block:'start'});}}>編集</button>
        <button class="stamp-btn secondary" disabled={busy || !!loadError} onClick={()=>{if(confirm(`${e.date} ${e.amount.toLocaleString()}円の経費を削除しますか？`) && onSave(expenses.filter(x=>x.id!==e.id))) {if(form.id===e.id) reset();setStatus('削除しました。');}}}>削除</button>
      </div>
    </div>)}
  </>;
}

/* ────────────────── MAIN APP ────────────────── */
function SimProgress({actual,goal,forecast=0,label='売上の進捗'}) {
  const max=Math.max(goal,actual+forecast,1);
  return <div className="sim-progress" role="img" aria-label={`${label}：実績 ${actual.toLocaleString()}円、目標 ${goal.toLocaleString()}円、見込み ${forecast.toLocaleString()}円`}>
    <span className="sim-progress-actual" style={{width:(Math.max(0,actual)/max*100)+'%'}}/>
    <span className="sim-progress-forecast" style={{width:(forecast/max*100)+'%'}}/>
  </div>;
}
function SimulationTotalCard({title,data,id}) {
  // Only three money figures: goal, recorded sales, and what is still needed.
  const yen=n=>Math.round(n).toLocaleString()+'円';
  const left=data.goal-data.actualDelivery;
  return <section className="card simulation-total" data-testid={'outlook-'+id} aria-label={title+'の目標と売上'}>
    <h3>{title}</h3>
    <dl className="money-list">
      <div><dt>目標</dt><dd data-testid={id==='back'?'back-effective-goal':id+'-goal'}>{yen(data.goal)}</dd></div>
      <div><dt>売上</dt><dd data-testid={id+'-actual'}>{yen(data.actualDelivery)}</dd></div>
      <div className={left<0?'is-over':'is-left'}><dt>{left<0?'超過':'あと'}</dt><dd data-testid={id+'-left'}>{yen(Math.abs(left))}</dd></div>
    </dl>
    {data.carried>0&&id==='back'&&<p className="sim-note">目標は設定 <span data-testid="back-configured-goal">{yen(data.configuredGoal)}</span> ＋ 前半の不足 <span data-testid="front-carryover">{yen(data.carried)}</span></p>}
    <p className="sim-note">目標は日別計画の合計、売上は配達分です。</p>
    <SimProgress actual={data.actualDelivery} goal={data.goal} label={title+'の売上'}/>
  </section>;
}
function DailyPlanningEditor({outlook,vault,goals,p,today,onChange,onActualDate}) {
  const {plan,parts}=outlook,weekStart=parts[0].part.w.start;
  const yen=n=>Math.round(n).toLocaleString()+'円';
  const initialPart=()=>Math.max(0,parts.findIndex(x=>today>=x.part.w.start&&today<=x.part.w.end));
  const initialDay=index=>parts[index].part.rows.find(r=>r.eligible&&p.drafts?.[r.date])?.date||parts[index].part.rows.find(r=>r.eligible&&!r.confirmed)?.date||'';
  const [partIndex,setPartIndex]=useState(initialPart),[selectedDate,setSelectedDate]=useState(()=>initialDay(initialPart()));
  const [message,setMessage]=useState(''),editorRef=React.useRef(null),overviewRef=React.useRef(null),moveFocus=React.useRef(false);
  useEffect(()=>{const i=initialPart();setPartIndex(i);setSelectedDate(initialDay(i));setMessage('');},[weekStart,today,parts.length]);
  const period=parts[partIndex]||parts[0],part=period.part;
  const row=part.rows.find(r=>r.date===selectedDate&&r.date>=today);
  useEffect(()=>{if(!moveFocus.current)return;moveFocus.current=false;requestAnimationFrame(()=>{const node=editorRef.current||overviewRef.current;node?.scrollIntoView({block:'start',behavior:'smooth'});node?.focus({preventScroll:true});});},[selectedDate,partIndex]);
  const selectDay=date=>{moveFocus.current=true;setSelectedDate(date);};
  const selectPart=i=>{moveFocus.current=true;setPartIndex(i);setSelectedDate(initialDay(i));setMessage('');};
  const edit=(r,key,field,value)=>onChange(dailyEdit(p,r,key,field,value));
  const confirm=()=>{
    try{
      const next=dailyGoalConfirm(vault,goals,p,row.date,today);if(onChange(next)===false)return;
      const nextDate=part.rows.find(r=>r.date>row.date&&r.eligible&&!next.confirmed?.[r.date])?.date||'';
      setMessage(row.date+'の計画を確定しました。'+(nextDate?nextDate+'の設定へ進みました。':'この日より後の未確定稼働日はありません。期間合計と残りを確認してください。'));
      selectDay(nextDate);
    }catch(e){setMessage(e.message);}
  };
  const input=(r,key,field,label,placeholder,step=1)=>{
    const own=p.drafts?.[r.date]?.[key]||p.confirmed?.[r.date]?.[key]||p.daily?.[r.date]?.[key]||{};
    return <label>{field==='count'?'計画件数':field==='price'?'単価（円）':'UPH'}<input aria-label={`${r.date} ${key==='u'?'Uber':'出前館'} ${label}`} type="number" inputMode="decimal" min="0" step={step} value={own[field]??''} placeholder={String(placeholder)} onChange={e=>{if(e.target.validity.valid)edit(r,key,field,e.target.value);}}/></label>;
  };
  const badges=(r,editing=false)=><span className="day-badges">{r.date===today&&<span className="day-badge">今日</span>}{editing&&<span className="day-badge editing">編集中</span>}<span className={'day-badge '+(r.confirmed?'confirmed':'')}>{r.confirmed?'確定済み':'未確定'}</span>{r.draft&&<span className="day-badge">変更あり・目標反映済み</span>}{r.setting.mode==='off'&&<span className="day-badge">休み</span>}</span>;
  const names=parts.length===1?['選択週']:['週前半（月〜木）','週後半（金〜日）'];
  return <div className="daily-editor">
    <div className="outlook-grid">
      <SimulationTotalCard title="週売上目標" data={outlook.week} id="week"/>
      {parts.length>1&&parts.map((x,i)=><SimulationTotalCard key={x.part.w.start} title={names[i]} data={x} id={i===0?'front':'back'}/>)}
    </div>
    <div className="period-picker" role="group" aria-label="日別設定する期間">{parts.map((x,i)=><button key={x.part.w.start} aria-pressed={i===partIndex} onClick={()=>selectPart(i)}>{names[i]}<small>{x.part.w.start.slice(5)}〜{x.part.w.end.slice(5)}</small></button>)}</div>
    <section className="card period-workspace" data-testid={'daily-period-'+part.w.start}>
      <h3 ref={overviewRef} tabIndex="-1" className="editor-scroll-anchor">{names[partIndex]}の残りと日別設定</h3>
      <h4 className="workspace-label">日別一覧</h4>
      <div className="daily-choice-list">{part.rows.map(r=>{const diff=r.baseTarget===undefined?0:r.target-r.baseTarget;return r.date<today?<div className="past-day-choice" key={r.date}><span>{r.date.slice(5).replace('-','/')}　売上 {yen(r.actualTotal)}</span><button className="sim-text-button" onClick={()=>onActualDate(r.date)}>実績を確認・修正 →</button></div>:<button key={r.date} className="daily-choice" data-testid={'day-choice-'+r.date} aria-label={r.date+'の計画を編集'} aria-current={r.date===selectedDate?'true':'false'} onClick={()=>selectDay(r.date)}><span className="choice-date">{r.date.slice(5).replace('-','/')}</span><span className="choice-money">{r.setting.mode==='off'?<strong data-testid={'day-choice-target-'+r.date}>休み</strong>:<><span>目標 <strong data-testid={'day-choice-target-'+r.date}>{yen(r.target)}</strong></span>{r.date===today&&<><span>売上 <strong>{yen(r.actual)}</strong></span><span>{r.over>0?'超過':'あと'} <strong>{yen(r.over>0?r.over:r.remaining)}</strong></span></>}{diff!==0&&<span className={'choice-carry '+(diff>0?'carry-up':'carry-down')} data-testid={'day-choice-carry-'+r.date}>今日の{diff>0?'不足':'超過'} {diff>0?'＋':'−'}{yen(Math.abs(diff))}</span>}</>}</span><span className="choice-counts">Uber {r.u}件 · 出前館 {r.d}件</span>{badges(r,r.date===selectedDate)}</button>;})}</div>
      {(()=>{const future=part.rows.filter(r=>r.date>today&&r.eligible);return future.length?<p className="daily-sum" data-testid="future-target-sum">明日以降の目標合計 <strong>{yen(future.reduce((n,r)=>n+r.target,0))}</strong>（配達分）</p>:null;})()}
      {message&&<p role="status" className="sim-live">{message}</p>}
      {!row&&<div className="period-completion" data-testid="period-completion"><h4>{period.allConfirmed?(part.reflected?'今後の計画はすべて確定済みです':'期間内の全稼働日が確定済みです'):period.active.length?'日別一覧から編集する日を選んでください':part.reflected?'翌日以降の配分先はありません':'この期間に残りの稼働日はありません'}</h4>{(period.unallocatedUber>0||period.unallocatedDelivery>0)&&<p className="sim-warning">配分できる稼働日がありません：Uber {period.unallocatedUber}件 ／ 配達 {yen(period.unallocatedDelivery)}</p>}<p className="sim-note">確定済みの日も一覧から選んで編集・再確定できます。</p></div>}
      {row&&<article className="day-editor" data-testid={'allocation-'+row.date}>
        <h3 ref={editorRef} tabIndex="-1" className="editor-scroll-anchor" id="selected-day-heading">{row.date.slice(5)}の計画を編集</h3>{badges(row,true)}
        <div className="editor-toolbar">
        {row.setting.mode!=='off'&&<div className="editor-actions"><button className="gen-btn" data-testid="confirm-plan" onClick={confirm}>計画を確定して次の日へ</button><small>{row.draft?'編集中 · 目標には反映済みです':row.confirmed?'確定済み · 編集・再確定できます':'未確定 · 日別計画から目標を集計します'}</small></div>}
        </div>
        <div className="editor-target"><span>この日の目標（配達分）</span><strong data-testid="day-target">{row.setting.mode==='off'?'休み':yen(row.target)}</strong><span>計画時間 {dailyTime(row.minutes)}</span></div>
        <label>稼働予定<select aria-label={row.date+'の稼働予定'} value={row.setting.mode==='off'?'off':'auto'} onChange={e=>{const s=pdaySetting(p,goals,row.date);onChange({...p,days:{...p.days,[row.date]:e.target.value==='off'?{...s,mode:'off',resumeMode:s.mode}:{...s,mode:s.resumeMode||'auto'}}});}}><option value="auto">稼働する</option><option value="off">休み</option></select></label>
        {row.setting.mode!=='off'&&<>
          {['u','d'].map(key=><div className="editor-company" key={key}><h4>{key==='u'?'Uber Eats':'出前館'}</h4><div className="company-inputs">{input(row,key,'count','計画件数（空欄で自動）',row[key])}{input(row,key,'price','通常単価（円）',row.conditions[key].price,'any')}{input(row,key,'uph','UPH（件/時）',row.conditions[key].uph,'0.1')}</div><p className="company-plan">想定売上 {yen(row[key]*row.conditions[key].price)}{key==='u'&&<span data-testid="day-quest"> ／ 必須 {row.quest}件 ＋ 追加 {row.extraU}件</span>}</p></div>)}
          <div className="editor-fill" role="group" aria-label={part.w.start+' 不足を補う会社'}><span>不足売上を補う会社</span>{[['u','Uber Eats'],['d','出前館']].map(([key,label])=><button key={key} aria-pressed={part.fill===key} onClick={()=>onChange({...p,dailyPeriods:{...p.dailyPeriods,[part.w.start]:{fill:key}}})}>{label}</button>)}</div>
          <details><summary>金額を指定して件数を逆算</summary><label>配達売上目標（円・空欄で自動）<input aria-label={row.date+'の目標金額'} type="number" min="0" step="1" value={row.draft?(row.draft.basis==='amount'?row.draft.target:''):row.confirmed?(row.confirmed.basis==='amount'?row.confirmed.target:''):row.setting.mode==='amt'?row.setting.value:''} placeholder={String(row.target)} onChange={e=>{if(e.target.validity.valid)edit(row,'target',null,e.target.value);}}/></label><button onClick={()=>edit(row,'target',null,row.target)}>この金額から件数を再計算</button></details>
          <details><summary>プリセット・計算内訳・今日の残り</summary><p className="sim-note">件数入力は件数×単価で目標を試算し、金額入力は必要件数を逆算します。変更は日別・前半・後半・週の目標へ即時に反映します。</p>
            <p data-testid="day-supplement">必須・指定件数の売上に対する不足 {yen(row.deliveryGap||0)} → {row.fill==='u'?'Uber Eats':'出前館'}を追加 {row.salesAdded||0}件</p><p>両社の想定配達売上 <strong data-testid="day-projection">{yen(row.revenue)}</strong></p><p>入力済み配達実績 {yen(row.actual)} ／ 今日の残り {yen(row.remaining)} ／ 必要時間 {row.missingPrice?'単価未設定':dailyTime(row.remainingMinutes)}</p><p>Uber：計画 {row.u}件・実績 {row.actualU}件・残り {row.planRemainingU}件 ／ 出前館：計画 {row.d}件・実績 {row.actualD}件・残り {row.planRemainingD}件</p>
            <label>この日のプリセット<select aria-label={row.date+' プリセット'} defaultValue={p.model} id={'daily-model-'+row.date}>{p.models.map((m,i)=><option key={i} value={i}>{m.name}</option>)}</select></label><button onClick={()=>{const model=p.models[Number(document.getElementById('daily-model-'+row.date).value)];let next=p;for(const key of ['u','d'])for(const field of ['price','uph'])next=dailyEdit(next,row,key,field,field==='price'?model[key]:model.uph);onChange(next);}}>この日だけにプリセットを適用</button>
          </details>
          {row.missingPrice&&<p role="alert" className="sim-warning">不足を補う会社の単価を設定してください。</p>}

          {row.confirmed&&<button className="sim-text-button" onClick={()=>{if(onChange(dailyRelease(p,row.date))!==false)setMessage(row.date+'の確定を解除しました。');}}>確定を解除</button>}
          <button className="sim-text-button" data-testid="delete-daily-plan" onClick={()=>{if(onChange(dailyGoalDelete(p,row.date))!==false)setMessage(row.date+'の日別計画を削除しました。');}}>この日の日別計画を削除</button>
        </>}
        <button className="sim-text-button" onClick={()=>onActualDate(row.date)}>稼働で実績を入力 →</button>
      </article>}
    </section>
  </div>;
}

function Planner({view,vault,goals,date,p,onChange,onGoalsChange,navigate,error,onActualDate,today}) {
  const [tab,setTab]=useState('week'),[simDate,setSimDate]=useState(today),[notice,setNotice]=useState('');
  useEffect(()=>{if(view==='simulation'){setTab('week');setSimDate(today);}},[view,today]);
  const yen=n=>Math.round(n).toLocaleString()+'円';
  const change=next=>{try{pvalidate(next);const issue=plinkCheck(next,vault);if(issue)throw Error(issue);if(onChange(next)===false)return false;const editing=Object.entries(next.drafts||{}).some(([d,v])=>JSON.stringify(v)!==JSON.stringify(p.drafts?.[d]));setNotice(editing?'日別計画を保存し、日別・前半・後半・週の目標へ反映しました。':'変更を保存しました。日別計画から目標を集計しました。');return true;}catch(e){setNotice(e.message);return false;}};
  const field=(label,value,fn,opts={})=><label>{label}<input type="number" inputMode="decimal" min="0" step="1" value={value} onChange={e=>{if(e.target.validity.valid)fn(e.target.value);}} {...opts}/></label>;
  const calc=(key,value)=>change({...p,calc:{...p.calc,[key]:value}});
  const dayChange=(d,setting)=>change({...p,days:{...p.days,[d]:setting}});
  const qchange=(id,key,value)=>change({...p,quests:p.quests.map(q=>q.id===id?{...q,[key]:value}:q)});
  const sum=dailyGoalSummary(vault,goals,p,today),linkError=plinkCheck(p,vault),blocked=error||linkError;
  const outlook=dailyGoalOutlook(vault,goals,p,simDate,today);
  const week=pweek(vault,goals,p,simDate,today),[start,end]=prange(simDate,tab);
  const goal=tab==='week'?outlook.week.goal:pgoal(goals,simDate,tab),actual=pactual(vault,start,end);
  const updateGoal=value=>{onGoalsChange(psetGoal(goals,simDate,tab,value));setNotice('目標を保存しました。この期間の試算に反映済みです。');};
  const stepPeriod=direction=>{
    if(tab==='week')setSimDate(pdate(simDate,direction*7));
    else {const d=new Date(simDate+'T12:00:00');d.setDate(1);if(tab==='month')d.setMonth(d.getMonth()+direction);else d.setFullYear(d.getFullYear()+direction);setSimDate(formatDateToParam(d));}
  };
  const addQuest=part=>{
    const mon=prange(simDate,'week')[0],qstart=part==='front'?mon:pdate(mon,4),qend=part==='front'?pdate(mon,3):pdate(mon,6);
    change({...p,quests:[...p.quests,{id:qstart,start:qstart,end:qend,count:40,base:'',extra:'',adjust:0,aim:'base',finish:'n',status:'n',links:[]}]});
  };
  if(!['dashboard','simulation','settings'].includes(view))return null;
  if(view==='dashboard')return <section className="planner planner-home" aria-label="今日の目標と売上">
    <div className="card today-card">
      <div className="today-heading"><h2>今日</h2><span className="today-date">{today.slice(5).replace('-',' / ')}</span></div>
      <p className="sim-note">目標・売上は配達分です（クエスト報酬は含みません）。04:00で営業日が切り替わります。</p>
      {blocked?<p role="alert">{blocked}</p>:<>
        <div className="money-trio" data-testid="home-trio">
          <div><span>目標</span><strong data-testid="home-target">{sum.off?'休み':sum.hasGoal?yen(sum.target):'未設定'}</strong></div>
          <div><span>売上</span><strong data-testid="home-actual">{yen(sum.actual)}</strong></div>
          <div className={sum.over>0?'is-over':''}><span>{sum.over>0?'超過':'あと'}</span><strong data-testid="home-remaining">{sum.hasGoal||sum.off?yen(sum.over>0?sum.over:sum.remain):'—'}</strong></div>
        </div>
        <SimProgress actual={sum.actual} goal={sum.target}/>
        <div className="today-metrics"><div><span>あと必要な件数</span><strong data-testid="home-count">{!sum.hasGoal&&!sum.uberNeed?'—':sum.need===null?'単価を設定':sum.need+'件'}</strong><small>Uber {sum.row.remainingU}件{sum.row.remainingD?' · 出前館 '+sum.row.remainingD+'件':''}</small></div><div><span>あと必要な時間</span><strong data-testid="home-time">{!sum.hasGoal&&!sum.uberNeed?'—':sum.time}</strong></div></div>
        {sum.reason&&<p className="sim-warning">{sum.reason}</p>}
        {sum.quotas.map(q=><p className="sim-note" key={q.id}>Uberクエスト：今日あと{q.today}件（期間残り{q.remaining}件／{q.days}稼働日）{q.unallocated?' · 未配分'+q.unallocated+'件。確定件数と残り稼働日を確認してください':''}</p>)}
        {!sum.hasGoal&&<p>売上管理で今日の日別計画を入力すると、目標が表示されます。</p>}
      </>}
      {(()=>{const next=sum.plan.rows.filter(r=>r.date>today&&r.eligible&&r.date<=pdate(today,6));const days=['日','月','火','水','木','金','土'];return next.length?<div className="carry-preview" data-testid="carry-preview"><p className="carry-title">明日以降の目標</p><ul>{next.map(r=>{const diff=r.baseTarget===undefined?0:r.target-r.baseTarget;return <li key={r.date} data-testid={'carry-'+r.date}><span>{r.date.slice(5).replace('-','/')}（{days[new Date(r.date+'T12:00:00').getDay()]}）</span><strong>{yen(r.target)}</strong>{diff!==0&&<small className={diff>0?'carry-up':'carry-down'}>今日の{diff>0?'不足':'超過'} {diff>0?'＋':'−'}{yen(Math.abs(diff))}</small>}</li>;})}</ul><p className="sim-note">各日の日別計画から目標を表示します。</p></div>:null;})()}
      <button className="gen-btn sim-open" onClick={()=>navigate('simulation')}>🧮 売上管理 <small>週タブへ →</small></button>
    </div>
  </section>;
  if(view==='settings')return <section className="planner view-container active"><div className="card"><h2>週の単価・UPHプリセット</h2>{p.models.map((m,i)=><div key={i}><h3>{m.name}</h3><div className="grid-3">{['u','d','uph'].map((k,j)=><React.Fragment key={k}>{field(['Uber単価（円）','出前館単価（円）','UPH（件/時）'][j],m[k],v=>change({...p,models:p.models.map((x,z)=>z===i?{...x,[k]:v}:x)}),{step:k==='uph'?'0.1':'any'})}</React.Fragment>)}</div></div>)}</div></section>;
  return <section className="planner view-container active simulation" aria-label="売上管理">
    <div className="sim-heading"><div><h2>🧮 売上管理</h2><p className="sim-note">実績をもとに、次の売上を組み立てる</p></div><button onClick={()=>navigate('dashboard')}>稼働へ →</button></div>
    <div className="sim-tabs" role="tablist" aria-label="売上管理の期間">{[['week','週'],['month','月'],['year','年']].map(([key,label])=><button key={key} id={'sim-tab-'+key} role="tab" aria-selected={tab===key} aria-controls="simulation-panel" tabIndex={tab===key?0:-1} onKeyDown={e=>{const tabs=['week','month','year'];if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];setTab(next);document.getElementById('sim-tab-'+next).focus();}}} onClick={()=>{setTab(key);setNotice('');}}>{label}<span>{key==='week'?'日別の配分':key==='month'?'月の見通し':'年の見通し'}</span></button>)}</div>
    <div id="simulation-panel" role="tabpanel" aria-labelledby={'sim-tab-'+tab}>
      <div className="sim-period"><button aria-label="前の期間" onClick={()=>stepPeriod(-1)}>←</button><strong>{tab==='week'?start.slice(5)+' 〜 '+end.slice(5):tab==='month'?simDate.slice(0,7).replace('-','年')+'月':simDate.slice(0,4)+'年'}</strong><button aria-label="次の期間" onClick={()=>stepPeriod(1)}>→</button></div>
      <div className="sim-period-input"><label>{tab==='week'?'週に含まれる日':tab==='month'?'対象月':'対象年'}<input aria-label="売上管理対象期間" type={tab==='week'?'date':tab==='month'?'month':'number'} min={tab==='year'?'2000':undefined} max={tab==='year'?'9999':undefined} value={tab==='week'?simDate:tab==='month'?simDate.slice(0,7):Number(simDate.slice(0,4))} onChange={e=>{const v=e.target.value;if(tab==='year'){if(/^\d{4}$/.test(v)&&Number(v)>=2000)setSimDate(v+'-01-01');}else if(v)setSimDate(tab==='month'?v+'-01':v);}}/></label><button onClick={()=>setSimDate(today)}>今{tab==='week'?'週':tab==='month'?'月':'年'}へ</button></div>
      {blocked&&<p className="sim-warning" role="alert">{blocked}</p>}
      <fieldset className="sim-fields" disabled={!!error}>
        {tab!=='week'&&<div className="card sim-overview">
          {field((tab==='month'?'月':'年')+'の売上目標（円）',goal||'',updateGoal,{placeholder:'目標を入力','data-testid':'simulation-goal'})}
          <p className="sim-note">この目標・想定を変更しても、週の日別配分は変わりません。</p>
          <div className="sim-stats"><div><span>入力済み実績</span><strong data-testid="simulation-actual">{yen(actual)}</strong></div><div><span>目標までの不足額</span><strong data-testid="simulation-deficit">{goal?yen(Math.max(0,goal-actual)):'—'}</strong></div><div><span>達成率</span><strong>{goal?Math.round(actual/goal*100)+'%':'—'}</strong></div></div>
          <SimProgress actual={actual} goal={goal}/>
        </div>}
        {tab==='week'?<>
          <section className="card"><h3>週間売上実績</h3><p>入力済みの通常売上・報酬のみ。計画・見込みは含みません。</p><strong data-testid="weekly-actual-total">{yen(actual)}</strong><div className="weekly-actual-chart"><div className="sim-bars">{pdays(start,end).map((d,i)=>{const n=pday(vault,d).total,max=Math.max(1,...pdays(start,end).map(x=>pday(vault,x).total));return <div className="sim-bar-column" key={d}><span>{['月','火','水','木','金','土','日'][i]}</span><small>{d.slice(5)}</small><div className="sim-bar-well"><div className="sim-bar-fill" style={{height:Math.max(0,n)/max*100+'%'}}/></div><small>{yen(n)}</small></div>;})}</div></div><p className="sim-note">幅が狭い画面ではグラフを横へスクロールできます。</p></section>
          <DailyPlanningEditor outlook={outlook} vault={vault} goals={goals} p={p} today={today} onChange={change} onActualDate={onActualDate}/>
          <p className="sim-note">前半・後半・週売上目標は日別計画から自動集計します。件数×その日の単価、または直接指定した金額を使います。</p>

          <details className="card quest-settings"><summary>Uber Eats クエストの設定</summary><div><h3>Uber Eats クエスト</h3><p className="sim-note">前半：月〜木 ／ 後半：金〜日。終了は翌日04:00（日本時間）。Uber Eatsの件数だけを集計します。</p><div className="grid-2">{[['front','前半（月〜木）'],['back','後半（金〜日）']].map(([part,label])=>{const qs=part==='front'?week.start:pdate(week.start,4);return <button key={part} disabled={p.quests.some(q=>q.start<=(part==='front'?pdate(week.start,3):week.end)&&q.end>=qs)} onClick={()=>addQuest(part)}>{label}のクエストを追加</button>;})}</div>
            <p className="sim-note">クエスト件数と報酬見込みは、日別目標の合計とは別に確認できます。</p><p>入力済み売上に含む報酬と別に、未入力の見込み {yen(week.forecast)}</p><p className="sim-note">期間内のUber報酬を見込みから自動控除します。別日に入力した報酬は下で紐付けてください。見込みは売上実績に加算しません。</p>
          </div>
          {week.quests.map(({q,recorded,pending})=>{const count=pprogress(vault,q,today),target=pn(q.count)+(q.aim==='extra'?10:0);return <div className="card sim-quest" key={q.id}>
            <h3>{q.start===week.start?'週前半':q.start===pdate(week.start,4)?'週後半':'登録済みクエスト'} · {q.start.slice(5)} 〜 {q.end.slice(5)}</h3>
            <p data-testid={'quest-progress-'+q.id}>対象実績 {count}件 ／ {target}件（出前館などは対象外）</p><div className="sim-progress" role="progressbar" aria-label="Uberクエスト件数" aria-valuenow={count} aria-valuemin={0} aria-valuemax={Math.max(target,count)}><span className="sim-progress-actual" style={{width:Math.min(100,count/Math.max(1,target)*100)+'%'}}/></div>
            <div className="grid-3"><label>基本の対象回数<select aria-label="基本の対象回数" value={q.count} onChange={e=>qchange(q.id,'count',Number(e.target.value))}>{Array.from({length:12},(_,i)=>(i+1)*10).map(n=><option key={n} value={n}>{n}回</option>)}</select></label>{field('基本達成報酬（円）',q.base,v=>qchange(q.id,'base',v))}{field('追加10回の報酬（円）',q.extra,v=>qchange(q.id,'extra',v))}</div>
            <div className="grid-2"><label>目指す段階<select aria-label="目指す段階" value={q.aim} onChange={e=>qchange(q.id,'aim',e.target.value)}><option value="n">見込みに含めない</option><option value="base">基本達成</option><option value="extra">追加10回まで</option></select></label><label>結果の確認<select aria-label="結果の確認" value={q.status} onChange={e=>qchange(q.id,'status',e.target.value)}><option value="n">挑戦中（見込み）</option><option value="base">基本達成を確認</option><option value="extra">追加達成を確認</option><option value="miss">未達</option></select></label></div>
            <div className="sim-stats"><div><span>入力済み確定報酬</span><strong>{yen(recorded)}</strong></div><div><span>未入力の報酬見込み</span><strong>{yen(pending)}</strong></div></div><p className="sim-note">達成の確認だけでは実績売上に加算されません。報酬の実績入力は稼働で行ってください。</p>
            <details><summary>対象外件数・別日の報酬紐付け</summary>{field('Uber累計から除く対象外件数',q.adjust,v=>qchange(q.id,'adjust',v))}<p className="sim-note">期間外の日に入力済みのUber報酬を紐付けると、その分の見込みを控除します。</p>{q.links.map((l,i)=><div className="sim-link" key={i}><label>報酬の入力日<input type="date" value={l.date} onChange={e=>e.target.value&&qchange(q.id,'links',q.links.map((v,j)=>i===j?{...v,date:e.target.value}:v))}/></label>{field('紐付ける入力済み報酬（円）',l.amount,v=>qchange(q.id,'links',q.links.map((x,j)=>i===j?{...x,amount:v}:x)))}<button onClick={()=>qchange(q.id,'links',q.links.filter((_,j)=>i!==j))}>紐付けを解除</button></div>)}<button onClick={()=>qchange(q.id,'links',[...q.links,{date:today,amount:0}])}>別日の報酬を紐付ける</button></details>
            <button className="sim-text-button" onClick={()=>{if(confirm('クエスト設定を削除しますか？入力済みの売上実績は保持されます。'))change({...p,quests:p.quests.filter(x=>x.id!==q.id)});}}>クエスト設定を削除</button>
          </div>;})}
        </details>
        </>:(()=>{const h=phorizon(vault,goals,p,simDate,tab,today),setAssumption=(k,v)=>change({...p,horizons:{...p.horizons,[h.key]:{...h.setting,[k]:v}}});const buckets=tab==='year'?Array.from({length:12},(_,i)=>{const month=h.start.slice(0,4)+'-'+String(i+1).padStart(2,'0')+'-01';return {label:(i+1)+'月',value:pactual(vault,...prange(month,'month'))};}):Array.from({length:Math.ceil(pdays(h.start,h.end).length/7)},(_,i)=>{const a=pdate(h.start,i*7),b=pdate(a,6);return {label:(i*7+1)+'〜'+Math.min(i*7+7,Number(h.end.slice(8)))+'日',value:pactual(vault,a,b<h.end?b:h.end)};});return <>
          <div className="card"><h3>残り期間の見通し</h3><p>今日を含む残り {h.remainingDays}日 ／ 想定する稼働 {h.workDays}日</p><div className="grid-2">{field('残りの想定稼働日数（空欄は残り全日）',h.setting.workDays,v=>setAssumption('workDays',v),{max:h.remainingDays,placeholder:String(h.remainingDays)})}{field('今後1稼働日あたりの追加売上（円）',h.setting.daily,v=>setAssumption('daily',v),{placeholder:String(h.daily)})}</div><p className="sim-note">売上想定が空欄の場合は、この期間に売上を入力した日の平均 {yen(h.daily)} を使用します。今日に売上がある場合も、今後の想定は追加分として計算します。</p>
          <div className="sim-stats"><div><span>達成に必要な売上／稼働日</span><strong data-testid="horizon-required">{h.required===null?'稼働予定なし':yen(h.required)}</strong></div><div><span>この想定での着地</span><strong data-testid="horizon-projection">{yen(h.projection)}</strong></div><div><span>想定着地と目標の差</span><strong>{goal?(h.projection>=goal?'＋'+yen(h.projection-goal):'−'+yen(h.gap)):'—'}</strong></div></div><SimProgress actual={h.actual} goal={h.goal} forecast={h.daily*h.workDays} label="想定着地"/><div className="sim-legend"><span className="actual-dot">実績 {yen(h.actual)}</span><span className="forecast-dot">今後の想定 {yen(h.daily*h.workDays)}</span></div>
          <p className="sim-live" data-testid="horizon-outlook">{!goal?'目標を入力して見通しを確認できます。':h.projection>=goal?'この想定では目標を達成する見込みです。':h.workDays?'目標まであと '+yen(h.gap)+'。稼働日数・1日あたりの売上を調整して確認できます。':'残りの稼働予定がありません。目標・対象期間・稼働日数を確認してください。'}</p></div>
          <div className="card"><h3>{tab==='year'?'月別':'期間別'}の入力済み実績</h3><div className="sim-history">{buckets.map(b=><div key={b.label}><span>{b.label}</span><div><i style={{width:b.value/Math.max(...buckets.map(x=>x.value),1)*100+'%'}}/></div><strong>{yen(b.value)}</strong></div>)}</div><p className="sim-note">対象期間の全プラットフォームの売上と入力済み報酬を集計します。見込み報酬は含みません。</p></div>
        </>;})()}
      </fieldset>
    </div>
    <p className="sim-save-status" role="status">{notice||'変更はこの端末に自動保存されます。設定画面からJSONでバックアップできます。'}</p>
  </section>;
}

function App() {
  const [expenseState, setExpenseState] = useState(() => {
    try { return {items: cleanExpenses(JSON.parse(localStorage.getItem(SK.expenses) || '[]')), error: ''}; }
    catch { return {items: [], error: '経費データを読み込めません。既存データ保護のため保存を停止しています。バックアップから復元してください。'}; }
  });
  const expenses = expenseState.items;
  const saveExpenses = (items) => {
    if (expenseState.error) { alert(expenseState.error); return false; }
    try { const clean = cleanExpenses(items); localStorage.setItem(SK.expenses, JSON.stringify(clean)); setExpenseState({items: clean, error: ''}); setIsDirty(true); return true; }
    catch { alert('経費を保存できませんでした。入力内容を残しています。'); return false; }
  };
  const [vault, setVault] = useState(loadInitialVault);
  const [date, setDate] = useState(loadInitialDate);
  const [activeTab, setActiveTab] = useState('dashboard');
  useEffect(()=>{document.querySelector('.main-content')?.scrollTo(0,0);},[activeTab]);
  const [today,setToday] = useState(getBusinessDateStr);
  useEffect(()=>{const timer=setInterval(()=>setToday(getBusinessDateStr()),30000);return ()=>clearInterval(timer);},[]);
  const [planState, setPlanState] = useState(pload);
  const planning = planState.data;
  const savePlanning = next => {
    if(planState.error) {alert(planState.error);return false;}

  };
  const [period, setPeriod] = useState('day'); 
  const [periodicGoals, setPeriodicGoals] = useState(loadInitialGoals);
  
  // 📝 メモ管理 & ポップアップ編集モーダル状態

  const [memoFilter, setMemoFilter] = useState('すべて');
  const [memoSearch, setMemoSearch] = useState('');
  const [newMemoText, setNewMemoText] = useState('');
  const [newMemoCat, setNewMemoCat] = useState('🛵稼働');
  const [editingMemoId, setEditingMemoId] = useState(null);

  const [showLog, setShowLog] = useState(false);

  const [calYear, setCalYear] = useState(() => Number(loadInitialDate().split('-')[0]));
  const [calMonth, setCalMonth] = useState(() => Number(loadInitialDate().split('-')[1]));

  const dayData = useMemo(() => {

  useEffect(() => {

  const updateDayField = useCallback((field, value) => {

  const updateSet = useCallback((i, key, val) => {

  const toggleOpen = (i) => {
